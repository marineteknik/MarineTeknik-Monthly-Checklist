function calcEffDay(baseDay,adjDay,year,mi,holidays){
  let day=adjDay!=null?adjDay:baseDay;
  const hols=((holidays||{})[`${year}-${mi}`]||[]).map(h=>h.day);
  let g=0;
  while(g++<20){const dow=new Date(year,mi,day).getDay();if(dow===0||dow===6||hols.includes(day))day++;else break;}
  return day;
}
function dayLabel(year,mi,day){if(!day)return"";const d=new Date(year,mi,day);return `${DOWS[d.getDay()]} ${MONTHS[mi].slice(0,3)} ${day}`;}

async function sbLoadConfig(){
  const {data,error}=await db.from('mt_config').select('*');
  if(error){console.error('loadConfig',error);return null;}
  const out={tasks:[],team:DEFAULT_TEAM,cats:DEFAULT_CATS,holidays:{}};
  (data||[]).forEach(row=>{
    if(row.key==='tasks')     out.tasks    =JSON.parse(row.value);
    if(row.key==='team')      out.team     =JSON.parse(row.value);
    if(row.key==='cats')      out.cats     =JSON.parse(row.value);
    if(row.key==='holidays')  out.holidays =JSON.parse(row.value);
  });
  return out;
}

async function sbSaveConfig(key,value){
  const {error}=await db.from('mt_config').upsert({key,value:JSON.stringify(value),updated_at:new Date().toISOString()},{onConflict:'key'});
  if(error) console.error('saveConfig',key,error);
}

async function sbLoadStatuses(year,mi){
  const {data,error}=await db.from('mt_statuses').select('*').eq('year',year).eq('month',mi);
  if(error){console.error('loadStatuses',error);return {};}
  const out={};
  (data||[]).forEach(row=>{out[`${row.year}-${row.month}-${row.task_id}`]=row;});
  return out;
}

async function sbPatchStatus(year,mi,taskId,patch){
  const key=`${year}-${mi}-${taskId}`;
  const {data:existing}=await db.from('mt_statuses').select('id').eq('year',year).eq('month',mi).eq('task_id',taskId).maybeSingle();
  const payload={year,month:mi,task_id:taskId,updated_at:new Date().toISOString(),...patch};
  if(existing){
    const {error}=await db.from('mt_statuses').update(payload).eq('id',existing.id);
    if(error) console.error('patchStatus update',error);
  } else {
    const {error}=await db.from('mt_statuses').insert(payload);
    if(error) console.error('patchStatus insert',error);
  }
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const today=new Date();

  // Core state
  const [ready,    setReady]    =useState(false);
  const [syncing,  setSyncing]  =useState(false);
  const [syncLabel,setSyncLabel]=useState('Connected');
  const [year,     setYear]     =useState(today.getFullYear());
  const [mi,       setMi]       =useState(today.getMonth());
  const [tasks,    setTasksRaw] =useState([]);
  const [statuses, setStatuses] =useState({});
  const [team,     setTeam]     =useState(DEFAULT_TEAM);
  const [holidays, setHolidays] =useState({});
  const [cats,     setCats]     =useState(DEFAULT_CATS);

  // UI state
  const [view,       setView]      =useState("checklist");
  const [fCat,       setFCat]      =useState("All");
  const [fOwner,     setFOwner]    =useState("All");
  const [statusTask, setStatusTask]=useState(null);
  const [editTask,   setEditTask]  =useState(null);
  const [holOpen,    setHolOpen]   =useState(false);
  const [yrOpen,     setYrOpen]    =useState(false);
  const [toast,      setToast]     =useState(null);

  const toastTimer=useRef(null);
  const showToast=(msg,type='info')=>{
    setToast({msg,type});
    clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(null),3000);
  };

  // ── Initial load ────────────────────────────────────────────────────────────
  useEffect(()=>{
    (async()=>{
      setSyncing(true);
      try{
        const cfg=await sbLoadConfig();
        if(cfg){
          if(cfg.tasks.length>0){
            setTasksRaw(cfg.tasks);
          } else {
            // First launch — seed all defaults into Supabase
            setTasksRaw(DEFAULT_TASKS);
            setCats(DEFAULT_CATS);
            setTeam(DEFAULT_TEAM);
            await sbSaveConfig('tasks', DEFAULT_TASKS);
            await sbSaveConfig('cats', DEFAULT_CATS);
            await sbSaveConfig('team', DEFAULT_TEAM);
          }
          if(cfg.team && cfg.team.length>0) setTeam(cfg.team);
          if(cfg.cats && cfg.cats.length>0) setCats(cfg.cats);
          setHolidays(cfg.holidays);
        }
        const sts=await sbLoadStatuses(today.getFullYear(),today.getMonth());
        setStatuses(sts);
        setReady(true);
        setSyncLabel('Connected');
      }catch(e){
        console.error(e);
        showToast('Could not connect to database. Check Supabase config.','error');
        setReady(true);
      }
      setSyncing(false);
    })();
  },[]);

  // ── Reload statuses on month change ─────────────────────────────────────────
  useEffect(()=>{
    if(!ready) return;
    (async()=>{
      setSyncing(true);setSyncLabel('Loading…');
      const sts=await sbLoadStatuses(year,mi);
      setStatuses(sts);
      setSyncing(false);setSyncLabel('Connected');
    })();
  },[year,mi,ready]);

  // ── Realtime subscription for statuses ──────────────────────────────────────
  useEffect(()=>{
    if(!ready) return;
    const channel=db.channel('mt_statuses_changes')
      .on('postgres_changes',{event:'*',schema:'public',table:'mt_statuses'},(payload)=>{
        const r=payload.new||payload.old;
        if(!r||r.year!==year||r.month!==mi) return;
        const k=`${r.year}-${r.month}-${r.task_id}`;
        if(payload.eventType==='DELETE'){
          setStatuses(prev=>{const n={...prev};delete n[k];return n;});
        } else {
          setStatuses(prev=>({...prev,[k]:r}));
        }
        setSyncLabel('Live ✓');
      })
      .subscribe();
    return ()=>db.removeChannel(channel);
  },[year,mi,ready]);

  // ── Realtime subscription for config ────────────────────────────────────────
  useEffect(()=>{
    if(!ready) return;
    const channel=db.channel('mt_config_changes')
      .on('postgres_changes',{event:'*',schema:'public',table:'mt_config'},(payload)=>{
        const r=payload.new;
        if(!r) return;
        try{
          if(r.key==='tasks')    setTasksRaw(JSON.parse(r.value));
          if(r.key==='team')     setTeam(JSON.parse(r.value));
          if(r.key==='cats')     setCats(JSON.parse(r.value));
          if(r.key==='holidays') setHolidays(JSON.parse(r.value));
        }catch(e){}
        setSyncLabel('Live ✓');
      })
      .subscribe();
    return ()=>db.removeChannel(channel);
  },[ready]);

  // ── Task writers (save to Supabase + update local state) ────────────────────
  const setTasks=useCallback(async(updaterOrVal)=>{
    const next=typeof updaterOrVal==='function'?updaterOrVal(tasks):updaterOrVal;
    setTasksRaw(next);
    await sbSaveConfig('tasks',next);
  },[tasks]);

  const saveTeam=useCallback(async(next)=>{
    setTeam(next);
    await sbSaveConfig('team',next);
  },[]);

  const saveCats=useCallback(async(next)=>{
    setCats(next);
    await sbSaveConfig('cats',next);
  },[]);

  const saveHolidays=useCallback(async(next)=>{
    setHolidays(next);
    await sbSaveConfig('holidays',next);
  },[]);

  // ── Status helpers ───────────────────────────────────────────────────────────
  const key   =tid=>`${year}-${mi}-${tid}`;
  const getSt =tid=>{
    const r=statuses[key(tid)]||{};
    return{
      ownerStatus:    r.owner_status||'',
      reviewerStatus: r.reviewer_status||'',
      completionDate: r.completion_date||'',
      adjustedDeadline:r.adjusted_deadline??null,
      notes:          r.notes||'',
    };
  };

  const patch=useCallback(async(tid,p)=>{
    // Optimistic local update
    const k=key(tid);
    const existing=statuses[k]||{year,month:mi,task_id:tid};
    const merged={...existing};
    if('ownerStatus'    in p) merged.owner_status    =p.ownerStatus;
    if('reviewerStatus' in p) merged.reviewer_status =p.reviewerStatus;
    if('completionDate' in p) merged.completion_date =p.completionDate;
    if('adjustedDeadline' in p) merged.adjusted_deadline=p.adjustedDeadline;
    if('notes'          in p) merged.notes           =p.notes;
    setStatuses(prev=>({...prev,[k]:merged}));
    // Persist
    const dbPatch={};
    if('ownerStatus'    in p) dbPatch.owner_status    =p.ownerStatus;
    if('reviewerStatus' in p) dbPatch.reviewer_status =p.reviewerStatus;
    if('completionDate' in p) dbPatch.completion_date =p.completionDate;
    if('adjustedDeadline' in p) dbPatch.adjusted_deadline=p.adjustedDeadline;
    if('notes'          in p) dbPatch.notes           =p.notes;
    await sbPatchStatus(year,mi,tid,dbPatch);
  },[statuses,year,mi]);

  // ── Deadline month = closing month + 1 ─────────────────────────────────────
  const dlMi   = mi === 11 ? 0  : mi + 1;
  const dlYear = mi === 11 ? year + 1 : year;
  const isCur  = today.getFullYear()===dlYear && today.getMonth()===dlMi;

  const effD=task=>calcEffDay(task.deadlineDay,getSt(task.id).adjustedDeadline,dlYear,dlMi,holidays);

  // ── Month nav ────────────────────────────────────────────────────────────────
  const navMon=dir=>{
    if(dir===-1&&mi===0){setMi(11);setYear(y=>y-1);}
    else if(dir===1&&mi===11){setMi(0);setYear(y=>y+1);}
    else setMi(m=>m+dir);
  };

  // ── Task crud ────────────────────────────────────────────────────────────────
  const saveTask=async t=>{
    const next=!t.id
      ?[...tasks,{...t,id:Date.now()}]
      :tasks.map(x=>x.id===t.id?t:x);
    await setTasks(next);
    setEditTask(null);
    showToast(t.id?'Task updated':'Task added','success');
  };
  const deleteTask=async id=>{
    if(!window.confirm("Delete this task?")) return;
    await setTasks(tasks.filter(x=>x.id!==id));
    showToast('Task deleted');
  };

  // ── Excel export ─────────────────────────────────────────────────────────────
  const doExport=()=>{
    const wb=XLSX.utils.book_new();

    // Sheet 1 — Current Month Status
    const monthName=MONTHS[mi];
    const headers=["#","Task","Category","Owner","Reviewer","Base Deadline","Effective Deadline","Owner Status","Reviewer Status","Completion Date","Notes"];
    const rows=tasks.map((t,i)=>{
      const st=getSt(t.id);
      const eff=effD(t);
      return [
        i+1, t.name, t.category, t.owner, t.reviewer,
        ord(t.deadlineDay),
        `${DOWS[new Date(year,mi,eff).getDay()]} ${ord(eff)} ${monthName}`,
        st.ownerStatus||'Not Started',
        st.reviewerStatus||'Not Started',
        st.completionDate||'',
        st.notes||'',
      ];
    });
    const wsData=[
      [`MarineTeknik Monthly Close — ${monthName} ${year}`],[],
      [`Generated: ${new Date().toLocaleString()}`],[],
      headers,...rows,
    ];
    const ws=XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols']=[{wch:4},{wch:52},{wch:16},{wch:24},{wch:24},{wch:14},{wch:26},{wch:14},{wch:14},{wch:16},{wch:40}];
    ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:10}}];
    XLSX.utils.book_append_sheet(wb,ws,`${monthName} ${year}`);

    // Sheet 2 — Full Year Summary
    const yrHeaders=["Task","Category","Owner",...MONTHS.map(m=>m.slice(0,3))];
    const yrRows=tasks.map(t=>{
      const row=[t.name,t.category,t.owner];
      MONTHS.forEach((_,i2)=>{
        const r=statuses[`${year}-${i2}-${t.id}`];
        row.push(r?.owner_status||'');
      });
      return row;
    });
    const yrData=[[`Full Year Summary — FY${year}`],[],yrHeaders,...yrRows];
    const wsYr=XLSX.utils.aoa_to_sheet(yrData);
    wsYr['!cols']=[{wch:52},{wch:16},{wch:24},...MONTHS.map(()=>({wch:8}))];
    XLSX.utils.book_append_sheet(wb,wsYr,`FY${year} Summary`);

    // Sheet 3 — Task Master
    const tmHeaders=["Task","Category","Owner","Reviewer","Start Day","Deadline Day"];
    const tmRows=tasks.map(t=>[t.name,t.category,t.owner,t.reviewer,t.startDay,t.deadlineDay]);
    const tmData=[["Task Master List"],[],tmHeaders,...tmRows];
    const wsTm=XLSX.utils.aoa_to_sheet(tmData);
    wsTm['!cols']=[{wch:52},{wch:16},{wch:24},{wch:24},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb,wsTm,'Task Master');

    XLSX.writeFile(wb,`MarineTeknik_Close_${monthName}_${year}.xlsx`);
    showToast('Excel exported ✓','success');
  };

  // ── Derived ──────────────────────────────────────────────────────────────────
  const catNames=[...new Set([...cats.map(c=>c.name),...tasks.map(t=>t.category)])];
  const filtered=tasks.filter(t=>(fCat==="All"||t.category===fCat)&&(fOwner==="All"||t.owner===fOwner));
  const done=filtered.filter(t=>getSt(t.id).ownerStatus==="DONE").length;
  const pend=filtered.filter(t=>getSt(t.id).ownerStatus==="PENDING").length;
  const notS=filtered.filter(t=>!getSt(t.id).ownerStatus).length;
  const naC =filtered.filter(t=>getSt(t.id).ownerStatus==="N/A").length;
  const pct =(filtered.length-naC)>0?Math.round(done/(filtered.length-naC)*100):0;
  const overdue=isCur?tasks.filter(t=>{const s=getSt(t.id);return s.ownerStatus!=="DONE"&&s.ownerStatus!=="N/A"&&today.getDate()>effD(t);}):[];
  const mHols=((holidays||{})[`${dlYear}-${dlMi}`])||[];

  // ── Loading screen ───────────────────────────────────────────────────────────
  if(!ready) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:20,background:"#0f172a"}}>
      <span style={{fontSize:40}}>⚓</span>
      <div className="spinner"/>
      <div style={{color:"#94a3b8",fontSize:14}}>Connecting to Supabase…</div>
    </div>
  );

  return (
    <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:"#f1f5f9",minHeight:"100vh"}}>

      {/* ── HEADER ── */}
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <span style={{fontSize:24}}>⚓</span>
          <div>
            <div style={{fontWeight:800,fontSize:16,letterSpacing:"-0.5px"}}>MarineTeknik</div>
            <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px"}}>Monthly Close Tracker</div>
          </div>
        </div>

        <div style={{display:"flex",gap:3,background:"#1e293b",borderRadius:8,padding:3}}>
          {[["checklist","✓ Checklist"],["dashboard","📊 Dashboard"],["settings","⚙ Settings"]].map(([v,l])=>(
            <button key={v} style={{...S.navBtn,...(view===v?S.navOn:{})}} onClick={()=>setView(v)}>{l}</button>
          ))}
        </div>

        {/* Live sync badge */}
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:20,background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.3)"}}>
          {syncing
            ? <div style={{width:7,height:7,borderRadius:"50%",background:"#f59e0b",animation:"pulse 1s infinite"}}/>
            : <div className="live-dot"/>
          }
          <span style={{fontSize:11,fontWeight:700,color:syncing?"#f59e0b":"#10b981"}}>{syncLabel}</span>
        </div>

        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          {mHols.length>0&&<button style={S.holPill} onClick={()=>setHolOpen(true)}>🎌 {mHols.length} holiday{mHols.length>1?"s":""}</button>}
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <button style={S.arrBtn} onClick={()=>navMon(-1)}>‹</button>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",cursor:"pointer"}} onClick={()=>setYrOpen(true)}>
              <div style={{fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",lineHeight:1}}>Closing period</div>
              <button style={S.monBtn}>{MONTHS[mi]} {year} ▾</button>
              <div style={{fontSize:9,color:"#94a3b8",lineHeight:1}}>Due in {MONTHS[dlMi].slice(0,3)} {dlYear}</div>
            </div>
            <button style={S.arrBtn} onClick={()=>navMon(1)}>›</button>
          </div>
          <button style={S.expBtn} onClick={doExport}>↓ Export to Excel</button>
        </div>
      </div>

      {/* ── STATS BAR ── */}
      <div style={S.statsBar}>
        {[{n:done,l:"Done",c:"#10b981"},{n:pend,l:"Pending",c:"#f59e0b"},{n:notS,l:"Not Started",c:"#94a3b8"},{n:naC,l:"N/A",c:"#cbd5e1"}].map(x=>(
          <div key={x.l} style={{textAlign:"center",minWidth:52}}>
            <div style={{fontSize:22,fontWeight:800,color:x.c,lineHeight:1.1}}>{x.n}</div>
            <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px"}}>{x.l}</div>
          </div>
        ))}
        <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:180}}>
          <div style={{fontSize:12,fontWeight:700,color:"#1e293b"}}>{pct}% complete</div>
          <div style={{height:8,background:"#e2e8f0",borderRadius:4,overflow:"hidden"}}>
            <div style={{height:"100%",borderRadius:4,width:`${pct}%`,background:pct===100?"#10b981":pct>60?"#3b82f6":"#f59e0b",transition:"width .4s"}}/>
          </div>
        </div>
        <div style={{padding:"4px 12px",borderRadius:6,background:"#eff6ff",border:"1px solid #bfdbfe",fontSize:12,whiteSpace:"nowrap",color:"#1e40af",fontWeight:600}}>
          Closing <strong>{MONTHS[mi].slice(0,3)} {year}</strong> → Due in <strong>{MONTHS[dlMi].slice(0,3)} {dlYear}</strong>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <select style={S.sel} value={fCat}   onChange={e=>setFCat(e.target.value)}>
            <option value="All">All Categories</option>
            {catNames.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select style={S.sel} value={fOwner} onChange={e=>setFOwner(e.target.value)}>
            <option value="All">All Owners</option>
            {team.map(m=><option key={m.name} value={m.name}>{m.initials} – {m.name.split(" ")[0]}</option>)}
          </select>
          <button style={S.addBtn} onClick={()=>setEditTask(false)}>+ Add Task</button>
          <button style={S.holBtn} onClick={()=>setHolOpen(true)}>🎌 Holidays</button>
        </div>
      </div>

      {/* ── OVERDUE BANNER ── */}
      {overdue.length>0&&view==="checklist"&&(
        <div style={{background:"#fef2f2",borderBottom:"1px solid #fca5a5",padding:"8px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",fontSize:13,color:"#dc2626"}}>
          <span style={{fontWeight:700}}>⚠ {overdue.length} overdue:</span>
          {overdue.map(t=><span key={t.id} style={{background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:4,padding:"2px 8px",fontSize:12,whiteSpace:"nowrap"}}>{t.name.split("–")[0].trim()} (due {ord(effD(t))})</span>)}
        </div>
      )}

      {/* ── MAIN ── */}
      <div style={{padding:"20px",maxWidth:1300,margin:"0 auto"}}>
        {view==="checklist"&&(
          tasks.length===0
            ?<EmptyState onAdd={()=>setEditTask(false)} onSettings={()=>setView("settings")}/>
            :<ChecklistView tasks={filtered} getSt={getSt} patch={patch} effD={effD} team={team} cats={cats} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} isCur={isCur} todayD={today.getDate()} setTasks={setTasks} setStatusTask={setStatusTask} setEditTask={setEditTask} deleteTask={deleteTask}/>
        )}
        {view==="dashboard"&&<DashboardView tasks={tasks} statuses={statuses} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} getSt={getSt} effD={effD} team={team} cats={cats} holidays={holidays} patch={patch}/>}
        {view==="settings"&&<SettingsView team={team} setTeam={saveTeam} tasks={tasks} setTasks={setTasks} cats={cats} setCats={saveCats} holidays={holidays} setHolidays={saveHolidays} year={year} mi={mi} setEditTask={setEditTask} deleteTask={deleteTask}/>}
      </div>

      {/* ── MODALS ── */}
      {statusTask&&<StatusModal task={statusTask} getSt={getSt} patch={patch} onClose={()=>setStatusTask(null)} cats={cats} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} holidays={holidays}/>}
      {editTask!==null&&<EditTaskModal task={editTask||null} onClose={()=>setEditTask(null)} onSave={saveTask} onDelete={editTask?()=>{deleteTask(editTask.id);setEditTask(null);}:null} team={team} cats={cats} setCats={saveCats}/>}
      {holOpen&&<HolidayModal year={dlYear} mi={dlMi} holidays={holidays} setHolidays={saveHolidays} onClose={()=>setHolOpen(false)}/>}
      {yrOpen&&<YearPickModal year={year} mi={mi} onSelect={(y,m)=>{setYear(y);setMi(m);setYrOpen(false);}} onClose={()=>setYrOpen(false)}/>}

      {/* ── TOAST ── */}
      {toast&&(
        <div className="fade-in" style={{position:"fixed",bottom:20,right:20,zIndex:9999,padding:"12px 18px",borderRadius:10,background:toast.type==='error'?"#fef2f2":toast.type==='success'?"#f0fdf4":"#1e293b",color:toast.type==='error'?"#dc2626":toast.type==='success'?"#166534":"#f8fafc",fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.18)",borderLeft:`4px solid ${toast.type==='error'?"#dc2626":toast.type==='success'?"#10b981":"#3b82f6"}`}}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

// ── EMPTY STATE ───────────────────────────────────────────────────────────────
function EmptyState({onAdd,onSettings}){
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:360,gap:16,textAlign:"center"}}>
      <div style={{fontSize:56}}>📋</div>
      <div style={{fontSize:22,fontWeight:800,color:"#1e293b"}}>No tasks yet</div>
      <div style={{fontSize:15,color:"#64748b",maxWidth:400}}>Add your tasks manually or go to Settings to manage them. All data syncs live to your whole team.</div>
      <div style={{display:"flex",gap:12}}>
        <button style={{...S.addBtn,padding:"10px 22px",fontSize:15}} onClick={onAdd}>+ Add First Task</button>
        <button style={{...S.cancelBtn,padding:"10px 22px",fontSize:15}} onClick={onSettings}>⚙ Go to Settings</button>
      </div>
    </div>
  );
}

// ── CHECKLIST VIEW ────────────────────────────────────────────────────────────
function ChecklistView({tasks,getSt,patch,effD,team,cats,year,mi,dlYear,dlMi,isCur,todayD,setStatusTask,setEditTask,deleteTask}){
  const orderedCats=[...cats.map(c=>c.name),...tasks.map(t=>t.category).filter(c=>!cats.find(x=>x.name===c))];
  const grouped={};
  tasks.forEach(t=>{if(!grouped[t.category])grouped[t.category]=[];grouped[t.category].push(t);});

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {[...new Set(orderedCats)].filter(cat=>grouped[cat]?.length>0).map(cat=>{
        const ct=grouped[cat];
        const cdone=ct.filter(t=>getSt(t.id).ownerStatus==="DONE").length;
        const cna  =ct.filter(t=>getSt(t.id).ownerStatus==="N/A").length;
        return(
          <div key={cat} style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              <span style={{width:10,height:10,borderRadius:"50%",background:cc(cat,cats),flexShrink:0,display:"inline-block"}}/>
              <span style={{fontWeight:700,fontSize:13,color:"#1e293b",flex:1}}>{cat}</span>
              <span style={{fontSize:12,color:"#64748b",fontWeight:600}}>{cdone}/{ct.length-cna} complete</span>
            </div>
            {ct.map(task=>{
              const st=getSt(task.id);
              const eff=effD(task);
              const base=task.deadlineDay;
              const adj=st.adjustedDeadline!=null;
              const moved=eff!==base;
              const isDone=st.ownerStatus==="DONE";
              const isPend=st.ownerStatus==="PENDING";
              const isOver=isCur&&!isDone&&st.ownerStatus!=="N/A"&&todayD>eff;
              const rowBg=isDone?"#f0fdf4":isPend?"#fffbeb":isOver?"#fef2f2":"#fff";
              const effDate=new Date(dlYear,dlMi,eff);
              const dow=DOWS[effDate.getDay()];

              return(
                <div key={task.id} className="trow" style={{display:"flex",alignItems:"center",padding:"10px 18px",borderBottom:"1px solid #f1f5f9",gap:12,background:rowBg,cursor:"default"}}>
                  <div style={{width:22,height:22,borderRadius:6,border:isDone?"none":"2px solid #cbd5e1",background:isDone?"#10b981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}
                    onClick={()=>{ if(isDone)patch(task.id,{ownerStatus:"",reviewerStatus:""}); else patch(task.id,{ownerStatus:"DONE",reviewerStatus:"DONE",completionDate:new Date().toISOString().split("T")[0]}); }}>
                    {isDone&&"✓"}
                  </div>

                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,color:isDone?"#94a3b8":"#1e293b",textDecoration:isDone?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{task.name}</div>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3,flexWrap:"wrap"}}>
                      <span style={{padding:"2px 7px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:tcol(task.owner,team),flexShrink:0}}>{ini(task.owner,team)}</span>
                      {st.notes&&<span title={st.notes} style={{fontSize:11,cursor:"help"}}>📝</span>}
                    </div>
                  </div>

                  <div style={{textAlign:"right",flexShrink:0,minWidth:118,padding:"5px 10px",borderRadius:8,background:isOver?"#fef2f2":moved?"#f5f3ff":"#f8fafc",border:`1px solid ${isOver?"#fca5a5":moved?"#ddd6fe":"#e2e8f0"}`}}>
                    <div style={{fontSize:13,fontWeight:700,color:isOver?"#dc2626":moved?"#7c3aed":"#1e293b"}}>{isOver?"⚠ ":""}{dow} {ord(eff)}</div>
                    <div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>{MONTHS[dlMi].slice(0,3)} {dlYear}</div>
                    {moved&&<div style={{fontSize:10,color:adj?"#7c3aed":"#0891b2",fontWeight:600,marginTop:1}}>{adj?"adjusted":"skipped"} from {ord(base)}</div>}
                  </div>

                  <div style={{display:"flex",gap:8,flexShrink:0}}>
                    <MiniDrop label="Owner"    value={st.ownerStatus}    onChange={v=>patch(task.id,{ownerStatus:v})}/>
                    <MiniDrop label="Reviewer" value={st.reviewerStatus} onChange={v=>patch(task.id,{reviewerStatus:v})}/>
                  </div>

                  <div style={{display:"flex",gap:5,flexShrink:0}}>
                    <button style={S.smBtn} onClick={()=>setStatusTask(task)}>Status</button>
                    <button style={{...S.smBtn,color:"#7c3aed",borderColor:"#ddd6fe"}} onClick={()=>setEditTask(task)}>✏ Edit</button>
                    <button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5"}} onClick={()=>deleteTask(task.id)}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

function MiniDrop({label,value,onChange}){
  const cm={DONE:{background:"#dcfce7",color:"#166534",border:"1px solid #86efac"},PENDING:{background:"#fef9c3",color:"#854d0e",border:"1px solid #fde047"},"N/A":{background:"#f1f5f9",color:"#64748b",border:"1px solid #cbd5e1"}};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:2}}>
      <span style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px"}}>{label}</span>
      <select style={{padding:"3px 7px",borderRadius:5,border:"1px solid #e2e8f0",fontSize:12,background:"#f8fafc",cursor:"pointer",...(cm[value]||{})}} value={value||""} onChange={e=>onChange(e.target.value)}>
        <option value="">—</option><option value="DONE">✓ Done</option><option value="PENDING">⏳ Pending</option><option value="N/A">N/A</option>
      </select>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function DashboardView({tasks,statuses,year,mi,dlYear,dlMi,getSt,effD,team,cats,holidays,patch}){
  const [tab,setTab]=useState("overview");
  const catNames=[...new Set(tasks.map(t=>t.category))];
  const today=new Date();
  const isCur=today.getFullYear()===dlYear&&today.getMonth()===dlMi;

  const mStats=MONTHS.map((m,i)=>{
    const tot=tasks.length;
    const dn=tasks.filter(t=>statuses[`${year}-${i}-${t.id}`]?.owner_status==="DONE").length;
    const na=tasks.filter(t=>statuses[`${year}-${i}-${t.id}`]?.owner_status==="N/A").length;
    return{month:m.slice(0,3),done:dn,total:tot-na,pct:tot-na>0?Math.round(dn/(tot-na)*100):0};
  });
  const cStats=catNames.map(cat=>{
    const ct=tasks.filter(t=>t.category===cat);
    const dn=ct.filter(t=>getSt(t.id).ownerStatus==="DONE").length;
    const na=ct.filter(t=>getSt(t.id).ownerStatus==="N/A").length;
    const tot=ct.length-na;
    return{cat,done:dn,total:tot,pct:tot>0?Math.round(dn/tot*100):0};
  });
  const oStats=team.map(m=>{
    const mt=tasks.filter(t=>t.owner===m.name);if(!mt.length)return null;
    const dn=mt.filter(t=>getSt(t.id).ownerStatus==="DONE").length;
    const ov=isCur?mt.filter(t=>{const s=getSt(t.id);return s.ownerStatus!=="DONE"&&s.ownerStatus!=="N/A"&&today.getDate()>effD(t);}).length:0;
    return{...m,total:mt.length,done:dn,overdue:ov,pct:Math.round(dn/mt.length*100)};
  }).filter(Boolean);

  if(tasks.length===0) return <div style={{textAlign:"center",padding:"60px 20px",color:"#94a3b8",fontSize:15}}>No tasks yet.</div>;

  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"flex",gap:4,background:"#e2e8f0",borderRadius:8,padding:3,width:"fit-content"}}>
        {[["overview","📊 Overview"],["manager","👔 Manager View"],["deadlines","📅 Deadline Manager"]].map(([v,l])=>(
          <button key={v} style={{padding:"7px 18px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:tab===v?"#fff":"transparent",color:tab===v?"#0f172a":"#64748b",boxShadow:tab===v?"0 1px 3px rgba(0,0,0,.1)":"none"}} onClick={()=>setTab(v)}>{l}</button>
        ))}
      </div>

      {tab==="overview"&&(
        <>
          <div style={{background:"#fff",borderRadius:12,padding:"20px 24px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={S.dTitle}>FY{year} — Monthly Progress</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(12,1fr)",gap:8}}>
              {mStats.map((m,i)=>(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 4px",borderRadius:8,border:i===mi?"2px solid #3b82f6":"1px solid #f1f5f9",background:i===mi?"#eff6ff":"#fff"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase"}}>{m.month}</div>
                  <svg viewBox="0 0 36 36" style={{width:52,height:52}}>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke="#e2e8f0" strokeWidth="3.2"/>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke={m.pct===100?"#10b981":m.pct>0?"#3b82f6":"#e2e8f0"} strokeWidth="3.2" strokeDasharray={`${m.pct} ${100-m.pct}`} strokeDashoffset="25" transform="rotate(-90 18 18)"/>
                    <text x="18" y="20.5" textAnchor="middle" fontSize="7" fill={m.pct===100?"#10b981":"#1e293b"} fontWeight="700">{m.pct}%</text>
                  </svg>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{m.done}/{m.total}</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:280,background:"#fff",borderRadius:12,padding:"20px 24px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={S.dTitle}>By Category — {MONTHS[mi].slice(0,3)}</div>
              {cStats.map(c=>(
                <div key={c.cat} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:cc(c.cat,cats),flexShrink:0}}/>
                  <div style={{fontSize:13,color:"#374151",width:100,flexShrink:0}}>{c.cat}</div>
                  <div style={{flex:1,height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden"}}>
                    <div style={{height:"100%",borderRadius:3,background:c.pct===100?"#10b981":cc(c.cat,cats),width:`${c.pct}%`}}/>
                  </div>
                  <div style={{fontSize:12,color:"#64748b",minWidth:32,textAlign:"right"}}>{c.done}/{c.total}</div>
                </div>
              ))}
            </div>
            <div style={{flex:1,minWidth:280,background:"#fff",borderRadius:12,padding:"20px 24px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={S.dTitle}>By Team Member — {MONTHS[mi].slice(0,3)}</div>
              {oStats.map(m=>(
                <div key={m.name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#1e293b",marginBottom:3}}>{m.name.split(" ").slice(0,2).join(" ")}{m.overdue>0&&<span style={{marginLeft:8,fontSize:11,color:"#dc2626",fontWeight:700}}>⚠ {m.overdue} overdue</span>}</div>
                    <div style={{height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:3,background:m.pct===100?"#10b981":m.color,width:`${m.pct}%`}}/>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:"#64748b",minWidth:32,textAlign:"right"}}>{m.done}/{m.total}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {tab==="manager"&&<ManagerView tasks={tasks} statuses={statuses} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} getSt={getSt} effD={effD} team={team} cats={cats} isCur={isCur} today={today}/>}
      {tab==="deadlines"&&<DeadlineManager tasks={tasks} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} holidays={holidays} getSt={getSt} patch={patch} cats={cats} team={team}/>}
    </div>
  );
}

// ── DEADLINE MANAGER ──────────────────────────────────────────────────────────
function DeadlineManager({tasks,year,mi,dlYear,dlMi,holidays,getSt,patch,cats,team}){
  const mHols=((holidays||{})[`${dlYear}-${dlMi}`])||[];
  const dim=new Date(dlYear,dlMi+1,0).getDate();
  const [local,setLocal]=useState({});
  const [saved,setSaved]=useState(false);

  const getVal=tid=>{if(local[tid]!==undefined)return local[tid];const a=getSt(tid).adjustedDeadline;return a!=null?String(a):"";};
  const getEff=(task,val)=>calcEffDay(task.deadlineDay,val!==""&&val!=null?parseInt(val):null,dlYear,dlMi,holidays);
  const hasChanges=Object.keys(local).length>0;

  const saveAll=()=>{
    Object.entries(local).forEach(([tid,val])=>patch(parseInt(tid),{adjustedDeadline:val!==""?parseInt(val):null}));
    setLocal({});setSaved(true);setTimeout(()=>setSaved(false),2500);
  };
  const resetTask=tid=>{setLocal(p=>{const n={...p};delete n[tid];return n;});patch(tid,{adjustedDeadline:null});};

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{background:"#fff",borderRadius:12,padding:"18px 22px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:mHols.length?14:0}}>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>📅 Deadline Manager — Closing {MONTHS[mi]} {year} · Due in {MONTHS[dlMi]} {dlYear}</div>
            <div style={{fontSize:13,color:"#64748b",marginTop:4}}>Override base deadlines for this month. Weekends and holidays are always skipped forward automatically.</div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {saved&&<span style={{fontSize:13,color:"#10b981",fontWeight:600}}>✓ Saved!</span>}
            {hasChanges&&!saved&&<span style={{fontSize:12,color:"#f59e0b",fontWeight:600}}>● Unsaved changes</span>}
            <button style={{...S.addBtn,...(!hasChanges?{opacity:.45,cursor:"not-allowed"}:{})}} disabled={!hasChanges} onClick={saveAll}>Save Deadlines</button>
          </div>
        </div>
        {mHols.length>0&&(
          <div style={{padding:"10px 14px",background:"#fefce8",borderRadius:8,border:"1px solid #fde68a",fontSize:13,color:"#92400e"}}>
            <strong>🎌 Holidays this month:</strong>{" "}{mHols.map((h,i)=><span key={i}>{ord(h.day)} {h.name}{i<mHols.length-1?", ":""}</span>)}
            <span style={{color:"#b45309",marginLeft:8}}>(deadlines auto-skip these)</span>
          </div>
        )}
      </div>
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"grid",gridTemplateColumns:"minmax(200px,1fr) 80px 120px 150px 130px 80px",padding:"10px 18px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px"}}>
          <div>Task</div><div style={{textAlign:"center"}}>Base Due</div><div style={{textAlign:"center"}}>Adjusted</div><div style={{textAlign:"center"}}>Effective Date</div><div style={{textAlign:"center"}}>Day of Week</div><div style={{textAlign:"center"}}>Reset</div>
        </div>
        {tasks.map(task=>{
          const val=getVal(task.id);
          const eff=getEff(task,val);
          const base=task.deadlineDay;
          const effDate=new Date(dlYear,dlMi,eff);
          const dow=DOWS[effDate.getDay()];
          const wknd=effDate.getDay()===0||effDate.getDay()===6;
          const isHol=mHols.some(h=>h.day===eff);
          const moved=eff!==(val!==""&&val!=null?parseInt(val):base);
          const hasAdj=val!=="";
          const isDirty=local[task.id]!==undefined;
          const isDone=getSt(task.id).ownerStatus==="DONE";

          return(
            <div key={task.id} style={{display:"grid",gridTemplateColumns:"minmax(200px,1fr) 80px 120px 150px 130px 80px",padding:"10px 18px",borderBottom:"1px solid #f1f5f9",alignItems:"center",background:isDirty?"#fefce8":isDone?"#f0fdf4":"#fff"}}>
              <div style={{paddingRight:12}}>
                <div style={{fontSize:13,fontWeight:600,color:isDone?"#94a3b8":"#1e293b",textDecoration:isDone?"line-through":"none"}}>{task.name}</div>
                <div style={{display:"flex",gap:6,marginTop:3,alignItems:"center"}}>
                  <span style={{padding:"1px 6px",borderRadius:4,fontSize:10,fontWeight:700,color:"#fff",background:cc(task.category,cats)}}>{task.category}</span>
                  <span style={{fontSize:11,color:"#94a3b8"}}>{ini(task.owner,team)}</span>
                  {isDone&&<span style={{fontSize:10,color:"#10b981",fontWeight:700}}>✓ Done</span>}
                </div>
              </div>
              <div style={{textAlign:"center",fontSize:14,fontWeight:700,color:"#64748b"}}>{ord(base)}</div>
              <div style={{textAlign:"center"}}>
                <input type="number" min="1" max={dim} style={{width:70,padding:"5px 8px",borderRadius:6,border:`2px solid ${isDirty?"#f59e0b":"#e2e8f0"}`,fontSize:13,textAlign:"center",background:isDirty?"#fffbeb":"#f8fafc",fontWeight:600}} placeholder={String(base)} value={val} onChange={e=>setLocal(p=>({...p,[task.id]:e.target.value}))}/>
                {isDirty&&<div style={{fontSize:10,color:"#f59e0b",marginTop:2}}>unsaved</div>}
              </div>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:14,fontWeight:700,color:moved?"#7c3aed":hasAdj?"#0891b2":"#1e293b"}}>{ord(eff)}</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>{MONTHS[dlMi].slice(0,3)} {dlYear}</div>
                {moved&&<div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginTop:1}}>↑ auto-skipped</div>}
              </div>
              <div style={{textAlign:"center"}}>
                <span style={{display:"inline-block",padding:"4px 10px",borderRadius:20,fontSize:12,fontWeight:700,background:wknd||isHol?"#fee2e2":"#dcfce7",color:wknd||isHol?"#dc2626":"#166534"}}>{dow} {isHol?"🎌":wknd?"⛔":"✓"}</span>
                {(wknd||isHol)&&<div style={{fontSize:10,color:"#dc2626",marginTop:2}}>→ moved to {ord(eff)}</div>}
              </div>
              <div style={{textAlign:"center"}}>
                {hasAdj?<button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5",fontSize:11}} onClick={()=>resetTask(task.id)}>Reset</button>:<span style={{fontSize:11,color:"#cbd5e1"}}>—</span>}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{fontSize:12,color:"#94a3b8",textAlign:"right"}}>💡 Leave "Adjusted" blank to use the base deadline. Deadlines fall in {MONTHS[dlMi]} {dlYear}.</div>
    </div>
  );
}

// ── STATUS MODAL ──────────────────────────────────────────────────────────────

  const [local,setLocal]=useState({...getSt(task.id)});
  const eff=calcEffDay(task.deadlineDay,local.adjustedDeadline,dlYear,dlMi,holidays);

  return(
    <Overlay onClose={onClose}>
      <div style={S.modal}>

          <div style={{flex:1}}>

            <div style={{fontSize:16,fontWeight:700,marginTop:8}}>{task.name}</div>
            <div style={{fontSize:12,color:"#64748b",marginTop:3}}>

              {eff!==task.deadlineDay&&<span style={{color:"#7c3aed"}}> (adjusted for weekends/holidays)</span>}
            </div>
          </div>
          <button style={S.xBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.mBody}>
          <FRow label="Owner Status"><StatusBtns value={local.ownerStatus||""} onChange={v=>setLocal(p=>({...p,ownerStatus:v}))}/></FRow>
          <FRow label="Reviewer Status"><StatusBtns value={local.reviewerStatus||""} onChange={v=>setLocal(p=>({...p,reviewerStatus:v}))}/></FRow>
          <FRow label="Completion Date"><input type="date" style={S.inp} value={local.completionDate||""} onChange={e=>setLocal(p=>({...p,completionDate:e.target.value}))}/></FRow>
          <FRow label={<>Adjusted Deadline <span style={{color:"#7c3aed",fontWeight:400,textTransform:"none",fontSize:11}}>(this month only)</span></>}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <input type="number" min="1" max="31" style={{...S.inp,width:80}} placeholder={task.deadlineDay} value={local.adjustedDeadline??""} onChange={e=>setLocal(p=>({...p,adjustedDeadline:e.target.value?parseInt(e.target.value):null}))}/>
              <span style={{fontSize:12,color:"#64748b"}}>weekends &amp; holidays auto-skipped</span>
              {local.adjustedDeadline!=null&&<button style={S.cancelBtn} onClick={()=>setLocal(p=>({...p,adjustedDeadline:null}))}>Clear</button>}
            </div>
          </FRow>
          <FRow label="Notes"><textarea style={{...S.inp,minHeight:72,resize:"vertical"}} value={local.notes||""} onChange={e=>setLocal(p=>({...p,notes:e.target.value}))} placeholder="Notes, blockers, reason for delay..."/></FRow>
        </div>
        <div style={S.mFtr}>
          <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
          <button style={S.saveBtn} onClick={save}>Save</button>
        </div>
      </div>
    </Overlay>
  );
}

// ── EDIT TASK MODAL ───────────────────────────────────────────────────────────
function EditTaskModal({task,onClose,onSave,onDelete,team,cats,setCats}){
  const isNew=!task;
  const catNames=cats.map(c=>c.name);
  const [form,setForm]=useState(task?{...task}:{name:"",owner:team[0]?.name||"",reviewer:team[0]?.name||"",startDay:1,deadlineDay:15,category:catNames[0]||"",custom:true});
  const [newCatMode,setNewCatMode]=useState(false);
  const [newCatName,setNewCatName]=useState("");
  const valid=form.name.trim()&&form.owner&&form.deadlineDay>=1&&form.deadlineDay<=31;

  const handleSave=async()=>{
    let cat=form.category;
    if(newCatMode&&newCatName.trim()){
      cat=newCatName.trim();
      if(!cats.find(c=>c.name===cat)) await setCats([...cats,{name:cat,color:"#374151"}]);
    }
    onSave({...form,category:cat,name:form.name.trim()});
  };

  return(
    <Overlay onClose={onClose}>
      <div style={S.modal}>
        <div style={S.mHdr}>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>{isNew?"➕ Add New Task":"✏ Edit Task"}</div>
            <div style={{fontSize:12,color:"#64748b",marginTop:3}}>{isNew?"Saved to Supabase — visible to everyone instantly.":"Changes sync live to all users."}</div>
          </div>
          <button style={S.xBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.mBody}>
          <FRow label="Task Name *"><input style={S.inp} value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="e.g. Bank Reconciliation" autoFocus={isNew}/></FRow>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <FRow label="Owner *">
              <select style={S.inp} value={form.owner} onChange={e=>setForm(p=>({...p,owner:e.target.value}))}>
                {team.map(m=><option key={m.name} value={m.name}>{m.name}</option>)}
              </select>
            </FRow>
            <FRow label="Reviewer">
              <select style={S.inp} value={form.reviewer} onChange={e=>setForm(p=>({...p,reviewer:e.target.value}))}>
                {team.map(m=><option key={m.name} value={m.name}>{m.name}</option>)}
              </select>
            </FRow>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <FRow label="Start Day"><input type="number" min="1" max="31" style={S.inp} value={form.startDay} onChange={e=>setForm(p=>({...p,startDay:parseInt(e.target.value)||1}))}/></FRow>
            <FRow label="Deadline Day *"><input type="number" min="1" max="31" style={S.inp} value={form.deadlineDay} onChange={e=>setForm(p=>({...p,deadlineDay:parseInt(e.target.value)||15}))}/></FRow>
          </div>
          <FRow label="Category">
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {!newCatMode
                ?<select style={{...S.inp,flex:1}} value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>{catNames.map(c=><option key={c} value={c}>{c}</option>)}</select>
                :<input style={{...S.inp,flex:1}} placeholder="New category name" value={newCatName} onChange={e=>setNewCatName(e.target.value)}/>
              }
              <button style={S.cancelBtn} onClick={()=>{setNewCatMode(v=>!v);setNewCatName("");}}>{newCatMode?"Use existing":"+ New cat"}</button>
            </div>
          </FRow>
        </div>
        <div style={{...S.mFtr,justifyContent:"space-between"}}>
          <div>{onDelete&&<button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5"}} onClick={onDelete}>🗑 Delete</button>}</div>
          <div style={{display:"flex",gap:10}}>
            <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
            <button style={{...S.saveBtn,...(!valid?{opacity:.5,cursor:"not-allowed"}:{})}} disabled={!valid} onClick={handleSave}>{isNew?"Add Task":"Save Changes"}</button>
          </div>
        </div>
      </div>
    </Overlay>
  );
}

            <div style={{display:"flex",gap:8,marginTop:10}}>

// ── SHARED COMPONENTS ─────────────────────────────────────────────────────────
function SCard({title,sub,children}){
  return(
    <div style={{background:"#fff",borderRadius:12,padding:"20px 22px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div style={{fontSize:15,fontWeight:700,marginBottom:sub?4:14}}>{title}</div>
      {sub&&<div style={{fontSize:13,color:"#64748b",marginBottom:14}}>{sub}</div>}
      {children}
    </div>
  );
}
function FRow({label,children}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      <label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px"}}>{label}</label>
      {children}
    </div>
  );
}
function StatusBtns({value,onChange}){
  const opts=[["DONE","✓ Done","#dcfce7","#166534"],["PENDING","⏳ Pending","#fef9c3","#854d0e"],["N/A","N/A","#f1f5f9","#64748b"],["","—","#f8fafc","#374151"]];
  return(
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      {opts.map(([v,l,bg,col])=><button key={v} style={{padding:"6px 16px",borderRadius:6,border:`1px solid ${value===v?"#3b82f6":"#e2e8f0"}`,background:value===v?"#3b82f6":bg,color:value===v?"#fff":col,cursor:"pointer",fontSize:13,fontWeight:500}} onClick={()=>onChange(v)}>{l}</button>)}
    </div>
  );
}
function HolidayModal({year,mi,holidays,setHolidays,onClose}){
  const key=`${year}-${mi}`;
  const [list,setList]=useState([...((holidays||{})[key]||[])]);
  const [nd,setNd]=useState("");const [nn,setNn]=useState("");
  const add=()=>{const d=parseInt(nd);if(!d||d<1||d>31||!nn.trim()||list.some(h=>h.day===d))return;setList(p=>[...p,{day:d,name:nn.trim()}].sort((a,b)=>a.day-b.day));setNd("");setNn("");};
  const common={0:[{day:1,name:"New Year's Day"}],1:[{day:17,name:"Presidents Day"}],4:[{day:26,name:"Memorial Day"}],6:[{day:4,name:"Independence Day"}],8:[{day:1,name:"Labor Day"}],10:[{day:11,name:"Veterans Day"},{day:27,name:"Thanksgiving"}],11:[{day:25,name:"Christmas Day"}]};
  const sugg=(common[mi]||[]).filter(s=>!list.some(h=>h.name===s.name));
  return(
    <Overlay onClose={onClose}>
      <div style={{...S.modal,maxWidth:480}}>
        <div style={S.mHdr}>
          <div><div style={{fontSize:16,fontWeight:700}}>🎌 Holidays — {MONTHS[mi]} {year}</div><div style={{fontSize:12,color:"#64748b",marginTop:3}}>Deadlines auto-skip these days. Saved to Supabase.</div></div>
          <button style={S.xBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.mBody}>
          {list.length===0&&<div style={{color:"#94a3b8",fontSize:14,textAlign:"center",padding:"12px 0"}}>No holidays set for this month.</div>}
          {list.map((h,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#fffbeb",borderRadius:8,border:"1px solid #fde68a",marginBottom:6}}>
              <span style={{fontWeight:700,fontSize:14,color:"#92400e",minWidth:28}}>{ord(h.day)}</span>
              <span style={{flex:1,fontSize:14}}>{h.name}</span>
              <button style={{padding:"4px 8px",borderRadius:6,border:"1px solid #fca5a5",background:"#fff",fontSize:12,cursor:"pointer",color:"#dc2626",fontWeight:600}} onClick={()=>setList(p=>p.filter((_,j)=>j!==i))}>✕</button>
            </div>
          ))}
          {sugg.length>0&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Quick Add</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{sugg.map((s,i)=><button key={i} style={S.cancelBtn} onClick={()=>setList(p=>[...p,s].sort((a,b)=>a.day-b.day))}>+ {s.name} ({ord(s.day)})</button>)}</div>
            </div>
          )}
          <div style={{display:"flex",gap:8,alignItems:"flex-end",marginTop:8}}>
            <FRow label="Day"><input type="number" min="1" max="31" style={{...S.inp,width:64}} placeholder="15" value={nd} onChange={e=>setNd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/></FRow>
            <div style={{flex:1}}><FRow label="Name"><input style={S.inp} placeholder="e.g. Company Outing" value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/></FRow></div>
            <button style={{...S.addBtn,height:38}} onClick={add}>+ Add</button>
          </div>
        </div>
        <div style={S.mFtr}>
          <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
          <button style={S.saveBtn} onClick={()=>{setHolidays({...(holidays||{}),[key]:list});onClose();}}>Save</button>
        </div>
      </div>
    </Overlay>
  );
}
function YearPickModal({year,mi,onSelect,onClose}){

        <div style={S.mBody}>
          <FRow label="Year"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{ys.map(y=><button key={y} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #e2e8f0",background:sy===y?"#3b82f6":"#f8fafc",color:sy===y?"#fff":"#374151",cursor:"pointer",fontWeight:sy===y?700:400}} onClick={()=>setSy(y)}>{y}</button>)}</div></FRow>
          <FRow label="Month"><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>{MONTHS.map((m,i)=><button key={i} style={{padding:"6px 4px",borderRadius:6,border:"1px solid #e2e8f0",background:sm===i?"#3b82f6":"#f8fafc",color:sm===i?"#fff":"#374151",cursor:"pointer",fontSize:12,fontWeight:sm===i?700:400}} onClick={()=>setSm(i)}>{m.slice(0,3)}</button>)}</div></FRow>

function Overlay({children,onClose}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()}>{children}</div>
    </div>
  );
}

// ── MANAGER VIEW ─────────────────────────────────────────────────────────────
function ManagerView({tasks,statuses,year,mi,dlYear,dlMi,getSt,effD,team,cats,isCur,today}){
  const [selMember,setSelMember]=useState("All");

  // For each team member, get their tasks and status for this month
  const memberData=team.map(m=>{
    const myTasks=tasks.filter(t=>t.owner===m.name);
    return{
      ...m,
      tasks:myTasks.map(t=>{
        const st=getSt(t.id);
        const eff=effD(t);
        const isOver=isCur&&st.ownerStatus!=="DONE"&&st.ownerStatus!=="N/A"&&today.getDate()>eff;
        return{...t,st,eff,isOver};
      }),
    };
  }).filter(m=>m.tasks.length>0);

  // Month by month table — each row = employee, each col = month
  const yearRows=team.map(m=>{
    const myTasks=tasks.filter(t=>t.owner===m.name);
    if(!myTasks.length) return null;
    const months=MONTHS.map((_,i)=>{
      const tot=myTasks.length;
      const dn=myTasks.filter(t=>statuses[`${year}-${i}-${t.id}`]?.owner_status==="DONE").length;
      const na=myTasks.filter(t=>statuses[`${year}-${i}-${t.id}`]?.owner_status==="N/A").length;
      const eff=tot-na;
      return{done:dn,total:eff,pct:eff>0?Math.round(dn/eff*100):0};
    });
    return{...m,months};
  }).filter(Boolean);

  const filtered=selMember==="All"?memberData:memberData.filter(m=>m.name===selMember);

  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>

      {/* ── SUMMARY CARDS ── */}
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        {memberData.map(m=>{
          const done=m.tasks.filter(t=>t.st.ownerStatus==="DONE").length;
          const overdue=m.tasks.filter(t=>t.isOver).length;
          const pend=m.tasks.filter(t=>t.st.ownerStatus==="PENDING").length;
          const pct=m.tasks.length>0?Math.round(done/m.tasks.length*100):0;
          return(
            <div key={m.name} onClick={()=>setSelMember(s=>s===m.name?"All":m.name)}
              style={{flex:"1 1 180px",background:"#fff",borderRadius:12,padding:"16px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",cursor:"pointer",border:selMember===m.name?"2px solid #3b82f6":"2px solid transparent",transition:"border .15s"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>{m.name.split(" ").slice(0,2).join(" ")}</div>
                  <div style={{fontSize:11,color:"#64748b"}}>{m.tasks.length} tasks</div>
                </div>
              </div>
              <div style={{height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden",marginBottom:6}}>
                <div style={{height:"100%",borderRadius:3,background:pct===100?"#10b981":m.color,width:`${pct}%`,transition:"width .4s"}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                <span style={{color:"#10b981",fontWeight:700}}>{done} done</span>
                {overdue>0&&<span style={{color:"#dc2626",fontWeight:700}}>⚠ {overdue} overdue</span>}
                {pend>0&&<span style={{color:"#f59e0b",fontWeight:700}}>{pend} pending</span>}
                <span style={{color:"#64748b"}}>{pct}%</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* ── TASK DETAIL TABLE ── */}
      {filtered.map(m=>{
        const done=m.tasks.filter(t=>t.st.ownerStatus==="DONE").length;
        return(
          <div key={m.name} style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 20px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
              <div style={{fontWeight:700,fontSize:15,color:"#1e293b",flex:1}}>{m.name}</div>
              <div style={{fontSize:12,color:"#64748b",fontWeight:600}}>{done}/{m.tasks.length} complete — {MONTHS[mi].slice(0,3)} {year} close · due {MONTHS[dlMi].slice(0,3)} {dlYear}</div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{background:"#f8fafc"}}>
                    <th style={{padding:"8px 16px",textAlign:"left",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Task</th>
                    <th style={{padding:"8px 12px",textAlign:"center",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Category</th>
                    <th style={{padding:"8px 12px",textAlign:"center",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Due</th>
                    <th style={{padding:"8px 12px",textAlign:"center",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Owner</th>
                    <th style={{padding:"8px 12px",textAlign:"center",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Reviewer</th>
                    <th style={{padding:"8px 12px",textAlign:"center",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Completed</th>
                    <th style={{padding:"8px 12px",textAlign:"left",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0"}}>Notes</th>
                  </tr>
                </thead>
                <tbody>
                  {m.tasks.map((t,idx)=>{
                    const isDone=t.st.ownerStatus==="DONE";
                    const isPend=t.st.ownerStatus==="PENDING";
                    const isNA=t.st.ownerStatus==="N/A";
                    const rowBg=isDone?"#f0fdf4":t.isOver?"#fef2f2":isPend?"#fffbeb":"#fff";
                    const statusColor=isDone?"#10b981":t.isOver?"#dc2626":isPend?"#f59e0b":isNA?"#94a3b8":"#cbd5e1";
                    const statusLabel=isDone?"✓ Done":t.isOver?"⚠ Overdue":isPend?"⏳ Pending":isNA?"N/A":"—";
                    const effDate=new Date(dlYear,dlMi,t.eff);
                    const dow=DOWS[effDate.getDay()];
                    return(
                      <tr key={t.id} style={{background:rowBg,borderBottom:"1px solid #f1f5f9"}}>
                        <td style={{padding:"10px 16px",fontSize:13,fontWeight:500,color:isDone?"#94a3b8":"#1e293b",textDecoration:isDone?"line-through":"none",maxWidth:300,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</td>
                        <td style={{padding:"10px 12px",textAlign:"center"}}>
                          <span style={{padding:"2px 7px",borderRadius:4,fontSize:10,fontWeight:700,color:"#fff",background:cc(t.category,cats),whiteSpace:"nowrap"}}>{t.category}</span>
                        </td>
                        <td style={{padding:"10px 12px",textAlign:"center",fontSize:12,fontWeight:600,color:t.isOver?"#dc2626":"#374151",whiteSpace:"nowrap"}}>{dow} {ord(t.eff)}</td>
                        <td style={{padding:"10px 12px",textAlign:"center"}}>
                          <span style={{padding:"3px 8px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:statusColor,whiteSpace:"nowrap"}}>{statusLabel}</span>
                        </td>
                        <td style={{padding:"10px 12px",textAlign:"center"}}>
                          {t.st.reviewerStatus?<span style={{padding:"3px 8px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:t.st.reviewerStatus==="DONE"?"#10b981":t.st.reviewerStatus==="PENDING"?"#f59e0b":"#94a3b8",whiteSpace:"nowrap"}}>{t.st.reviewerStatus==="DONE"?"✓ Done":t.st.reviewerStatus==="PENDING"?"⏳ Pending":"N/A"}</span>:<span style={{color:"#cbd5e1",fontSize:11}}>—</span>}
                        </td>
                        <td style={{padding:"10px 12px",textAlign:"center",fontSize:11,color:"#64748b"}}>{t.st.completionDate||"—"}</td>
                        <td style={{padding:"10px 12px",fontSize:11,color:"#64748b",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.st.notes||"—"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      {/* ── YEAR HISTORY TABLE ── */}
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{padding:"14px 20px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:14,color:"#1e293b"}}>
          📅 FY{year} — Month-by-Month Progress per Employee
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#0f172a"}}>
                <th style={{padding:"10px 16px",textAlign:"left",color:"rgba(255,255,255,0.7)",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",minWidth:160}}>Employee</th>
                {MONTHS.map((m,i)=>(
                  <th key={i} style={{padding:"10px 8px",textAlign:"center",color:i===mi?"#fbbf24":"rgba(255,255,255,0.7)",fontSize:11,fontWeight:i===mi?700:600,textTransform:"uppercase",letterSpacing:"0.5px",minWidth:52,background:i===mi?"rgba(255,255,255,0.08)":"transparent"}}>{m.slice(0,3)}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {yearRows.map((m,ri)=>(
                <tr key={m.name} style={{borderBottom:"1px solid #f1f5f9",background:ri%2===0?"#fff":"#f8fafc"}}>
                  <td style={{padding:"10px 16px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:28,height:28,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
                      <span style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>{m.name.split(" ").slice(0,2).join(" ")}</span>
                    </div>
                  </td>
                  {m.months.map((mo,i)=>(
                    <td key={i} style={{padding:"10px 8px",textAlign:"center",background:i===mi?"rgba(59,130,246,0.04)":"transparent"}}>
                      {mo.total===0
                        ?<span style={{color:"#cbd5e1",fontSize:11}}>—</span>
                        :<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                          <span style={{fontSize:12,fontWeight:700,color:mo.pct===100?"#10b981":mo.pct>0?"#3b82f6":"#94a3b8"}}>{mo.pct}%</span>
                          <span style={{fontSize:10,color:"#94a3b8"}}>{mo.done}/{mo.total}</span>
                        </div>
                      }
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── HOLIDAYS SETTINGS PANEL ───────────────────────────────────────────────────
function HolidaysSettingsPanel({year,holidays,setHolidays}){
  const [editingMonth,setEditingMonth]=useState(null);
  const [nd,setNd]=useState("");
  const [nn,setNn]=useState("");
  const common={0:[{day:1,name:"New Year's Day"}],1:[{day:17,name:"Presidents Day"}],4:[{day:26,name:"Memorial Day"}],6:[{day:4,name:"Independence Day"}],8:[{day:1,name:"Labor Day"}],10:[{day:11,name:"Veterans Day"},{day:27,name:"Thanksgiving"}],11:[{day:25,name:"Christmas Day"}]};

  const addHol=()=>{
    const d=parseInt(nd);
    if(!d||d<1||d>31||!nn.trim()) return;
    const key=`${year}-${editingMonth}`;
    const list=[...((holidays||{})[key]||[])];
    if(list.some(h=>h.day===d)) return;
    const updated={...(holidays||{}),[key]:[...list,{day:d,name:nn.trim()}].sort((a,b)=>a.day-b.day)};
    setHolidays(updated);
    setNd("");setNn("");
  };

  const removeHol=(mi,idx)=>{
    const key=`${year}-${mi}`;
    const list=[...((holidays||{})[key]||[])];
    list.splice(idx,1);
    setHolidays({...(holidays||{}),[key]:list});
  };

  return(
    <SCard title="🎌 Holidays" sub="Click any month to add or remove holidays. Deadlines auto-skip these days. Saved to Supabase instantly.">
      {MONTHS.map((m,i)=>{
        const key=`${year}-${i}`;
        const hs=((holidays||{})[key])||[];
        const isOpen=editingMonth===i;
        const sugg=(common[i]||[]).filter(s=>!hs.some(h=>h.name===s.name));
        return(
          <div key={i} style={{borderRadius:8,marginBottom:6,border:isOpen?"2px solid #3b82f6":"1px solid #e2e8f0",overflow:"hidden"}}>
            {/* Month header row */}
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:isOpen?"#eff6ff":"#f8fafc",cursor:"pointer"}} onClick={()=>setEditingMonth(isOpen?null:i)}>
              <div style={{width:48,fontSize:13,fontWeight:700,color:isOpen?"#1d4ed8":"#374151"}}>{m.slice(0,3)}</div>
              <div style={{flex:1,display:"flex",gap:6,flexWrap:"wrap"}}>
                {hs.length===0
                  ?<span style={{fontSize:12,color:"#cbd5e1"}}>No holidays — click to add</span>
                  :hs.map((h,j)=>(
                    <span key={j} style={{padding:"2px 8px",borderRadius:4,background:"#fef9c3",color:"#92400e",fontSize:11,fontWeight:700,border:"1px solid #fde047",display:"flex",alignItems:"center",gap:4}}>
                      {ord(h.day)}: {h.name}
                      {isOpen&&<span style={{cursor:"pointer",color:"#dc2626",fontWeight:900,marginLeft:2}} onClick={e=>{e.stopPropagation();removeHol(i,j);}}>×</span>}
                    </span>
                  ))
                }
              </div>
              <span style={{fontSize:12,color:isOpen?"#3b82f6":"#94a3b8"}}>{isOpen?"▲":"▼"}</span>
            </div>
            {/* Expanded editor */}
            {isOpen&&(
              <div style={{padding:"14px 16px",background:"#fff",borderTop:"1px solid #e2e8f0"}}>
                {sugg.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Quick Add</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {sugg.map((s,si)=>(
                        <button key={si} style={{padding:"4px 10px",borderRadius:6,border:"1px solid #e2e8f0",background:"#f8fafc",fontSize:12,cursor:"pointer",color:"#374151"}}
                          onClick={()=>{
                            const key=`${year}-${i}`;
                            const list=[...((holidays||{})[key]||[])];
                            const updated={...(holidays||{}),[key]:[...list,s].sort((a,b)=>a.day-b.day)};
                            setHolidays(updated);
                          }}>+ {s.name} ({ord(s.day)})</button>
                      ))}
                    </div>
                  </div>
                )}
                <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    <label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px"}}>Day</label>
                    <input type="number" min="1" max="31" style={{width:64,padding:"7px 10px",borderRadius:6,border:"1px solid #e2e8f0",fontSize:13,textAlign:"center"}} placeholder="15" value={nd} onChange={e=>setNd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHol()}/>
                  </div>
                  <div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}>
                    <label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px"}}>Holiday Name</label>
                    <input style={{padding:"7px 12px",borderRadius:6,border:"1px solid #e2e8f0",fontSize:13,width:"100%"}} placeholder="e.g. Company Outing" value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHol()}/>
                  </div>
                  <button style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#3b82f6",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",height:36}} onClick={addHol}>+ Add</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </SCard>
  );
}

// ── STYLES ────────────────────────────────────────────────────────────────────
const S={
  hdr:      {background:"#0f172a",color:"#f8fafc",display:"flex",alignItems:"center",padding:"0 20px",height:60,gap:16,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.3)",flexWrap:"wrap"},
  navBtn:   {padding:"5px 14px",borderRadius:6,border:"none",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:13,fontWeight:500},

  arrBtn:   {background:"#1e293b",border:"none",color:"#94a3b8",width:30,height:30,borderRadius:6,cursor:"pointer",fontSize:18,lineHeight:"1",display:"flex",alignItems:"center",justifyContent:"center"},
  monBtn:   {fontWeight:700,fontSize:14,minWidth:130,textAlign:"center",background:"#1e293b",border:"none",color:"#f8fafc",cursor:"pointer",padding:"5px 10px",borderRadius:6},
  holPill:  {padding:"4px 12px",borderRadius:20,background:"#fef9c3",color:"#92400e",border:"1px solid #fde68a",fontSize:12,fontWeight:600,cursor:"pointer"},
  expBtn:   {padding:"5px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",fontSize:12,cursor:"pointer"},
  statsBar: {background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"10px 20px",display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"},
  sel:      {padding:"6px 10px",borderRadius:6,border:"1px solid #e2e8f0",background:"#f8fafc",fontSize:13,color:"#1e293b",cursor:"pointer"},
  addBtn:   {padding:"6px 14px",borderRadius:6,border:"none",background:"#3b82f6",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer"},
  holBtn:   {padding:"6px 14px",borderRadius:6,border:"1px solid #fde68a",background:"#fef9c3",color:"#92400e",fontSize:13,fontWeight:600,cursor:"pointer"},
  smBtn:    {padding:"4px 10px",borderRadius:6,border:"1px solid #e2e8f0",background:"#fff",fontSize:12,cursor:"pointer",color:"#3b82f6",fontWeight:600},
  iconBtn:  {padding:"3px 6px",borderRadius:5,border:"1px solid #e2e8f0",background:"#fff",fontSize:11,cursor:"pointer",color:"#64748b"},
  saveBtn:  {padding:"7px 18px",borderRadius:8,border:"none",background:"#3b82f6",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:600},
  cancelBtn:{padding:"7px 18px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",cursor:"pointer",fontSize:14,color:"#64748b"},
  inp:      {padding:"8px 12px",borderRadius:6,border:"1px solid #e2e8f0",fontSize:14,color:"#0f172a",width:"100%"},
  modal:    {background:"#fff",borderRadius:16,width:"min(580px,95vw)",boxShadow:"0 24px 60px rgba(0,0,0,.25)",overflow:"hidden",maxHeight:"92vh",overflowY:"auto"},
  mHdr:     {padding:"20px 22px 14px",borderBottom:"1px solid #f1f5f9",display:"flex",justifyContent:"space-between",alignItems:"flex-start",position:"sticky",top:0,background:"#fff",zIndex:10},
  mBody:    {padding:"18px 22px",display:"flex",flexDirection:"column",gap:14},
  mFtr:     {padding:"14px 22px",borderTop:"1px solid #f1f5f9",display:"flex",justifyContent:"flex-end",gap:10,position:"sticky",bottom:0,background:"#fff"},
  xBtn:     {background:"#f1f5f9",border:"none",width:30,height:30,borderRadius:6,cursor:"pointer",fontSize:15,color:"#64748b",flexShrink:0},
  dTitle:   {fontSize:13,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:14},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
