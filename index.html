<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MarineTeknik – Monthly Close Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans','Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a}
    select,input,button,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
    .trow:hover{background:#f8fafc !important}
    input:focus,select:focus,textarea:focus{outline:2px solid #3b82f6;outline-offset:1px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 2s infinite;display:inline-block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .fade-in{animation:fadeIn .25s ease}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;font-family:'DM Sans',sans-serif;">
  <div style="background:#1e293b;border-radius:16px;padding:40px;width:380px;max-width:90vw;box-shadow:0 24px 60px rgba(0,0,0,.4);text-align:center;">
    <div style="font-size:40px;margin-bottom:14px;">⚓</div>
    <div style="font-size:20px;font-weight:800;color:#f8fafc;margin-bottom:4px;">MarineTeknik</div>
    <div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Monthly Close Tracker</div>
    <div style="font-size:11px;color:#475569;margin-bottom:28px;padding:8px 12px;background:#0f172a;border-radius:6px;">Team access only — enter the shared password to continue</div>
    <input id="pwd-input" type="password" placeholder="Enter password"
      style="width:100%;padding:12px 16px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px;"
      onkeydown="if(event.key==='Enter')checkPwd()"/>
    <button onclick="checkPwd()" id="sign-in-btn" style="width:100%;padding:12px;border-radius:8px;border:none;background:#3b82f6;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.15s;">Sign In</button>
    <div id="pwd-error" style="color:#f87171;font-size:13px;margin-top:12px;display:none;">Incorrect password. Please try again.</div>
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #1e293b;font-size:11px;color:#334155;">
      MarineTeknik Finance · 2026
    </div>
  </div>
</div>
<div id="root" style="display:none;"></div>
<script>
  (function(){
    var auth=sessionStorage.getItem('mt_auth');
    var ts=parseInt(sessionStorage.getItem('mt_auth_ts')||'0');
    var EIGHT_HRS=8*60*60*1000;
    if(auth==='ok'&&(Date.now()-ts)<EIGHT_HRS){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('root').style.display='block';
    } else {
      sessionStorage.removeItem('mt_auth');
      sessionStorage.removeItem('mt_auth_ts');
    }
  })();
  function checkPwd(){
    var val=document.getElementById('pwd-input').value;
    var btn=document.getElementById('sign-in-btn');
    if(val==='Marineteknik@2026'){
      sessionStorage.setItem('mt_auth','ok');
      sessionStorage.setItem('mt_auth_ts',Date.now().toString());
      btn.textContent='✓ Signed in…';
      btn.style.background='#10b981';
      setTimeout(function(){
        document.getElementById('login-screen').style.display='none';
        document.getElementById('root').style.display='block';
      },400);
    } else {
      document.getElementById('pwd-error').style.display='block';
      document.getElementById('pwd-input').value='';
      document.getElementById('pwd-input').focus();
      var input=document.getElementById('pwd-input');
      input.style.borderColor='#f87171';
      setTimeout(function(){input.style.borderColor='#334155';},1500);
    }
  }
</script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;
const SUPABASE_URL='https://xmvzeitjbobcfxmbpenh.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtdnplaXRqYm9iY2Z4bWJwZW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODkyNzgsImV4cCI6MjA4OTg2NTI3OH0.CKPIsjz0-_C31ixodPHVLfDdaRHQHdc-7-10Pk4SLzU';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOWS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEFAULT_TEAM=[{name:"Agnieszka Kubiak Ernandes",initials:"AKE",color:"#2D6A4F"},{name:"Helena Kivisto-Vila",initials:"HKV",color:"#1D4E89"},{name:"Glenn Davis",initials:"GD",color:"#7B2D8B"},{name:"Emerson Bam",initials:"EB",color:"#C0392B"},{name:"Cesar Gonzalez",initials:"CG",color:"#E67E22"},{name:"Ewelina Perfilow",initials:"EP",color:"#16A085"}];
const DEFAULT_CATS=[{name:"1. Cash & Banking",color:"#1e40af"},{name:"2. Credit Cards",color:"#7c3aed"},{name:"3. Accounts Payable",color:"#b45309"},{name:"4. Accounts Receivable",color:"#0891b2"},{name:"5. Cut-Off & Coordination",color:"#15803d"},{name:"6. Fixed Assets & Journals",color:"#0e7490"},{name:"7. Accruals & Liabilities",color:"#0f766e"},{name:"8. Inventory & Scrubs",color:"#be185d"},{name:"9. WIP & COGS",color:"#c2410c"},{name:"10. BC Period Control",color:"#374151"},{name:"11. Financial Reporting",color:"#065f46"}];

const ord=n=>(!n&&n!==0)?"—":n+(n===1?"st":n===2?"nd":n===3?"rd":"th");
function localDateStr(d){const dt=d||new Date();const y=dt.getFullYear();const m=String(dt.getMonth()+1).padStart(2,'0');const day=String(dt.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
const isComplete=st=>(st.ownerStatus==="DONE"||st.ownerStatus==="N/A")&&(st.reviewerStatus==="DONE"||st.reviewerStatus==="N/A"||!st.reviewerStatus);
function isLate(st,effDay,dlYear,dlMi){if(!st.completionDate)return false;const parts=st.completionDate.split('-');if(parts.length!==3)return false;const compVal=parseInt(parts[0])*10000+parseInt(parts[1])*100+parseInt(parts[2]);const dlMiNum=dlMi+1;const deadVal=dlYear*10000+dlMiNum*100+effDay;return compVal>deadVal;}
const cc=(cat,cats)=>(cats||[]).find(c=>c.name===cat)?.color||"#374151";
const ini=(nm,team)=>(team||[]).find(t=>t.name===nm)?.initials||(nm||"?").split(" ").map(x=>x[0]).join("").slice(0,3).toUpperCase();
const tcol=(nm,team)=>(team||[]).find(t=>t.name===nm)?.color||"#64748b";
function calcEffDay(baseDay,adjDay,year,mi,holidays){let day=adjDay!=null?adjDay:baseDay;const hols=((holidays||{})[`${year}-${mi}`]||[]).map(h=>h.day);let g=0;while(g++<20){const dow=new Date(year,mi,day).getDay();if(dow===0||dow===6||hols.includes(day))day++;else break;}return day;}

async function sbLoad(){const {data,error}=await db.from('mt_config').select('*');if(error){console.error(error);return null;}const out={tasks:[],team:[],cats:[],holidays:{},archived:[]};(data||[]).forEach(r=>{try{if(r.key==='tasks')out.tasks=JSON.parse(r.value);if(r.key==='team')out.team=JSON.parse(r.value);if(r.key==='cats')out.cats=JSON.parse(r.value);if(r.key==='holidays')out.holidays=JSON.parse(r.value);if(r.key==='archived')out.archived=JSON.parse(r.value);}catch(e){}});return out;}
async function sbSave(key,value){await db.from('mt_config').upsert({key,value:JSON.stringify(value),updated_at:new Date().toISOString()},{onConflict:'key'});}
async function sbLoadAllStatuses(year){const {data,error}=await db.from('mt_statuses').select('*').eq('year',year);if(error){console.error(error);return{};}const out={};(data||[]).forEach(r=>{out[`${r.year}-${r.month}-${r.task_id}`]=r;});return out;}
async function sbPatchStatus(year,mi,taskId,patch){const {data:ex}=await db.from('mt_statuses').select('id').eq('year',year).eq('month',mi).eq('task_id',taskId).maybeSingle();const payload={year,month:mi,task_id:taskId,updated_at:new Date().toISOString(),...patch};if(ex){await db.from('mt_statuses').update(payload).eq('id',ex.id);}else{await db.from('mt_statuses').insert(payload);}}

function App(){
  const today=new Date();
  const [ready,setReady]=useState(false);
  const [syncing,setSyncing]=useState(false);
  const [syncLabel,setSyncLabel]=useState('Connecting...');
  const [year,setYear]=useState(today.getFullYear());
  const [mi,setMi]=useState(today.getMonth());
  const [tasks,setTasksRaw]=useState([]);
  const [archived,setArchivedRaw]=useState([]);
  const [statuses,setStatuses]=useState({});
  const [team,setTeamRaw]=useState(DEFAULT_TEAM);
  const [holidays,setHolRaw]=useState({});
  const [cats,setCatsRaw]=useState(DEFAULT_CATS);
  const [view,setView]=useState("checklist");
  const [toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  const showToast=(msg,type='info')=>{setToast({msg,type});clearTimeout(toastTimer.current);toastTimer.current=setTimeout(()=>setToast(null),3500);};

  useEffect(()=>{(async()=>{setSyncing(true);try{const cfg=await sbLoad();if(cfg){if(cfg.tasks.length>0)setTasksRaw(cfg.tasks);else{setTasksRaw([]);await sbSave('tasks',[]);}if(cfg.team.length>0)setTeamRaw(cfg.team);else{setTeamRaw(DEFAULT_TEAM);await sbSave('team',DEFAULT_TEAM);}if(cfg.cats.length>0)setCatsRaw(cfg.cats);else{setCatsRaw(DEFAULT_CATS);await sbSave('cats',DEFAULT_CATS);}setHolRaw(cfg.holidays||{});setArchivedRaw(cfg.archived||[]);}const sts=await sbLoadAllStatuses(today.getFullYear());setStatuses(sts);setSyncLabel('Live');}catch(e){console.error(e);showToast('Connection error','error');}setSyncing(false);setReady(true);})();},[]); 

  useEffect(()=>{if(!ready)return;(async()=>{setSyncing(true);setSyncLabel('Loading...');const sts=await sbLoadAllStatuses(year);setStatuses(sts);setSyncing(false);setSyncLabel('Live');})();},[ year,ready]);

  useEffect(()=>{if(!ready)return;const ch1=db.channel('st').on('postgres_changes',{event:'*',schema:'public',table:'mt_statuses'},(p)=>{const r=p.new||p.old;if(!r||r.year!==year)return;const k=`${r.year}-${r.month}-${r.task_id}`;if(p.eventType==='DELETE')setStatuses(prev=>{const n={...prev};delete n[k];return n;});else setStatuses(prev=>({...prev,[k]:r}));setSyncLabel('Live ✓');}).subscribe();const ch2=db.channel('cfg').on('postgres_changes',{event:'*',schema:'public',table:'mt_config'},(p)=>{const r=p.new;if(!r)return;try{if(r.key==='tasks')setTasksRaw(JSON.parse(r.value));if(r.key==='team')setTeamRaw(JSON.parse(r.value));if(r.key==='cats')setCatsRaw(JSON.parse(r.value));if(r.key==='holidays')setHolRaw(JSON.parse(r.value));if(r.key==='archived')setArchivedRaw(JSON.parse(r.value));}catch(e){}setSyncLabel('Live ✓');}).subscribe();return()=>{db.removeChannel(ch1);db.removeChannel(ch2);};},[ year,mi,ready]);

  const setTasks=useCallback(async(v)=>{const n=typeof v==='function'?v(tasks):v;setTasksRaw(n);await sbSave('tasks',n);},[tasks]);
  const setArchived=useCallback(async(v)=>{const n=typeof v==='function'?v(archived):v;setArchivedRaw(n);await sbSave('archived',n);},[archived]);
  const setTeam=useCallback(async(v)=>{setTeamRaw(v);await sbSave('team',v);},[]);
  const setCats=useCallback(async(v)=>{setCatsRaw(v);await sbSave('cats',v);},[]);
  const setHolidays=useCallback(async(v)=>{setHolRaw(v);await sbSave('holidays',v);},[]);

  const sKey=(tid)=>`${year}-${mi}-${tid}`;
  const getSt=(tid)=>{const r=statuses[sKey(tid)]||{};return{ownerStatus:r.owner_status||'',reviewerStatus:r.reviewer_status||'',completionDate:r.completion_date||'',adjustedDeadline:r.adjusted_deadline??null,notes:r.notes||''};};
  const patch=useCallback(async(tid,p)=>{const k=sKey(tid);const ex=statuses[k]||{year,month:mi,task_id:tid};const merged={...ex};if('ownerStatus'in p)merged.owner_status=p.ownerStatus;if('reviewerStatus'in p)merged.reviewer_status=p.reviewerStatus;if('completionDate'in p)merged.completion_date=p.completionDate;if('adjustedDeadline'in p)merged.adjusted_deadline=p.adjustedDeadline;if('notes'in p)merged.notes=p.notes;setStatuses(prev=>({...prev,[k]:merged}));const dbP={};if('ownerStatus'in p)dbP.owner_status=p.ownerStatus;if('reviewerStatus'in p)dbP.reviewer_status=p.reviewerStatus;if('completionDate'in p)dbP.completion_date=p.completionDate;if('adjustedDeadline'in p)dbP.adjusted_deadline=p.adjustedDeadline;if('notes'in p)dbP.notes=p.notes;await sbPatchStatus(year,mi,tid,dbP);},[statuses,year,mi]);

  const dlMi=mi===11?0:mi+1;
  const dlYear=mi===11?year+1:year;
  const isCur=today.getFullYear()===dlYear&&today.getMonth()===dlMi;
  const effD=task=>calcEffDay(task.deadlineDay,getSt(task.id).adjustedDeadline,dlYear,dlMi,holidays);
  const navMon=dir=>{if(dir===-1&&mi===0){setMi(11);setYear(y=>y-1);}else if(dir===1&&mi===11){setMi(0);setYear(y=>y+1);}else setMi(m=>m+dir);};
  const archiveTask=async id=>{if(!window.confirm("Archive this task? It will be hidden but history is preserved."))return;await setArchived([...archived,id]);showToast('Task archived ✓');};
  const restoreTask=async id=>{await setArchived(archived.filter(x=>x!==id));showToast('Task restored ✓');};

  const catNames=[...new Set([...cats.map(c=>c.name),...tasks.filter(t=>!archived.includes(t.id)).map(t=>t.category)])];
  const filtered=tasks.filter(t=>!archived.includes(t.id));
  const done=filtered.filter(t=>{const s=getSt(t.id);return isComplete(s);}).length;
  const pct=filtered.length>0?Math.round(done/filtered.length*100):0;
  const mHols=((holidays||{})[`${dlYear}-${dlMi}`])||[];

  if(!ready)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:20,background:"#0f172a"}}><span style={{fontSize:40}}>⚓</span><div className="spinner"/><div style={{color:"#94a3b8",fontSize:14}}>Connecting to Supabase…</div></div>);

  return(<div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:"#f1f5f9",minHeight:"100vh"}}><div style={{background:"#0f172a",color:"#f8fafc",display:"flex",alignItems:"center",padding:"0 20px",height:60,gap:16,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.3)"}}><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:24}}>⚓</span><div><div style={{fontWeight:800,fontSize:16}}>MarineTeknik</div><div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase"}}>Monthly Close</div></div></div><div style={{display:"flex",alignItems:"center",gap:6,marginLeft:"auto",padding:"4px 10px",borderRadius:20,background:"rgba(16,185,129,0.1)"}}><div className="live-dot" style={{background:syncing?"#f59e0b":"#10b981"}}/><span style={{fontSize:11,fontWeight:700,color:syncing?"#f59e0b":"#10b981"}}>{syncLabel}</span></div><button onClick={()=>{sessionStorage.removeItem('mt_auth');window.location.reload();}} style={{padding:"5px 14px",borderRadius:6,border:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"rgba(255,255,255,0.6)",fontSize:12,fontWeight:600,cursor:"pointer"}}>⎋ Sign Out</button></div><div style={{padding:"10px 20px",background:"#fff",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>{[{n:done,l:"Complete",c:"#10b981"}].map(x=>(<div key={x.l} style={{textAlign:"center"}}><div style={{fontSize:22,fontWeight:800,color:x.c}}>{x.n}</div><div style={{fontSize:10,color:"#64748b"}}>{x.l}</div></div>))}<div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:"#1e293b"}}>{pct}% complete</div><div style={{height:8,background:"#e2e8f0",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:"#10b981"}}/></div></div></div><div style={{padding:"20px",maxWidth:1300,margin:"0 auto"}}><ChecklistView tasks={filtered} getSt={getSt} patch={patch} effD={effD} team={team} cats={cats} dlYear={dlYear} dlMi={dlMi} archiveTask={archiveTask}/></div>{toast&&<div className="fade-in" style={{position:"fixed",bottom:20,right:20,padding:"12px 18px",borderRadius:10,background:"#f0fdf4",color:"#166534",fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.18)"}}>{toast.msg}</div>}</div>);
}

function ChecklistView({tasks,getSt,patch,effD,team,cats,dlYear,dlMi,archiveTask}){
  const grouped={};
  tasks.forEach(t=>{if(!grouped[t.category])grouped[t.category]=[];grouped[t.category].push(t);});
  return(<div style={{display:"flex",flexDirection:"column",gap:16}}>{Object.keys(grouped).map(cat=>{const ct=grouped[cat];const cdone=ct.filter(t=>isComplete(getSt(t.id))).length;return(<div key={cat} style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}><div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}><span style={{width:10,height:10,borderRadius:"50%",background:cc(cat,cats),flexShrink:0}}/><span style={{fontWeight:700,fontSize:13,color:"#1e293b",flex:1}}>{cat}</span><span style={{fontSize:12,color:"#64748b"}}>{cdone}/{ct.length}</span></div>{ct.map(task=>{const st=getSt(task.id);const isDone=isComplete(st);const rowBg=isDone?"#f0fdf4":"#fff";return(<div key={task.id} style={{display:"flex",alignItems:"center",padding:"10px 18px",borderBottom:"1px solid #f1f5f9",gap:12,background:rowBg}}><div style={{width:22,height:22,borderRadius:6,border:isDone?"none":"2px solid #cbd5e1",background:isDone?"#10b981":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff",fontWeight:700,cursor:"pointer"}} onClick={()=>{if(isDone)patch(task.id,{ownerStatus:"",reviewerStatus:""});else patch(task.id,{ownerStatus:"DONE",reviewerStatus:"DONE",completionDate:localDateStr()});}}>{isDone&&"✓"}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:500,color:isDone?"#94a3b8":"#1e293b"}}>{task.name}</div><div style={{display:"flex",alignItems:"center",gap:8,marginTop:3}}><span style={{padding:"2px 7px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:tcol(task.owner,team)}}>{ini(task.owner,team)}</span>{st.completionDate&&<span style={{padding:"2px 7px",borderRadius:4,fontSize:10,fontWeight:600,color:"#166534",background:"#dcfce7",border:"1px solid #86efac"}}>✓ {st.completionDate}</span>}</div></div><div style={{textAlign:"right",flexShrink:0,minWidth:118,padding:"5px 10px",borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0"}}><div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>{DOWS[new Date(dlYear,dlMi,effD(task)).getDay()]} {ord(effD(task))}</div><div style={{fontSize:11,color:"#94a3b8"}}>{MONTHS[dlMi].slice(0,3)}</div></div><div style={{display:"flex",gap:8,flexShrink:0}}><select style={{padding:"3px 7px",borderRadius:5,border:"1px solid #e2e8f0",fontSize:12,background:"#f8fafc",cursor:"pointer"}} value={st.ownerStatus||""} onChange={e=>patch(task.id,{ownerStatus:e.target.value})}><option value="">—</option><option value="DONE">✓</option><option value="PENDING">⏳</option></select><button style={{padding:"4px 10px",borderRadius:6,border:"1px solid #fed7aa",background:"#fff",fontSize:12,cursor:"pointer",color:"#f59e0b",fontWeight:600}} onClick={()=>archiveTask(task.id)} title="Archive">📦</button></div></div>);})}</div>);})}</div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
