<script>
  // Check auth — session valid for 8 hours
  (function(){
    var auth=sessionStorage.getItem('mt_auth');
    var ts=parseInt(sessionStorage.getItem('mt_auth_ts')||'0');
    var EIGHT_HRS=8*60*60*1000;
    if(auth==='ok'&&(Date.now()-ts)<EIGHT_HRS){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('root').style.display='block';
    } else {
      sessionStorage.removeItem('mt_auth');
      sessionStorage.removeItem('mt_auth_ts');
    }
  })();
  function checkPwd(){
    var val=document.getElementById('pwd-input').value;
    var btn=document.getElementById('sign-in-btn');
    if(val==='Marineteknik@2026'){
      sessionStorage.setItem('mt_auth','ok');
      sessionStorage.setItem('mt_auth_ts',Date.now().toString());
      btn.textContent='✓ Signed in…';
      btn.style.background='#10b981';
      setTimeout(function(){
        document.getElementById('login-screen').style.display='none';
        document.getElementById('root').style.display='block';
      },400);
    } else {
      document.getElementById('pwd-error').style.display='block';
      document.getElementById('pwd-input').value='';
      document.getElementById('pwd-input').focus();
      // Shake animation
      var input=document.getElementById('pwd-input');
      input.style.borderColor='#f87171';
      setTimeout(function(){input.style.borderColor='#334155';},1500);
    }
  }
</script>

const ord  = n => (!n&&n!==0)?"—":n+(n===1?"st":n===2?"nd":n===3?"rd":"th");

// Get today's date as YYYY-MM-DD in LOCAL timezone (not UTC)
function localDateStr(d){
  const dt=d||new Date();
  const y=dt.getFullYear();
  const m=String(dt.getMonth()+1).padStart(2,'0');
  const day=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ✅ FIX 1: A task is "complete" ONLY if BOTH owner AND reviewer are explicitly marked DONE or N/A
const isComplete = st => (st.ownerStatus==="DONE"||st.ownerStatus==="N/A") && (st.reviewerStatus==="DONE"||st.reviewerStatus==="N/A");

// A task is "late" if it has a completion date that is after the effective deadline day
// OR if today is past the deadline and it is still not complete
function isLate(st, effDay, dlYear, dlMi){
  // Compare purely as integers: YYYYMMDD — no Date objects, no timezone issues
  if(!st.completionDate) return false;
  // completionDate is stored as 'YYYY-MM-DD'
  const parts = st.completionDate.split('-');
  if(parts.length !== 3) return false;
  const compVal = parseInt(parts[0])*10000 + parseInt(parts[1])*100 + parseInt(parts[2]);
  // deadline: dlYear, dlMi is 0-indexed so month+1 for numeric comparison
  const dlMiNum = dlMi + 1; // convert 0-indexed to 1-indexed
  const deadVal = dlYear*10000 + dlMiNum*100 + effDay;
  return compVal > deadVal;
}

function calcEffDay(baseDay,adjDay,year,mi,holidays){
  let day=adjDay!=null?adjDay:baseDay;
  const hols=((holidays||{})[`${year}-${mi}`]||[]).map(h=>h.day);
  let g=0;
  while(g++<20){const dow=new Date(year,mi,day).getDay();if(dow===0||dow===6||hols.includes(day))day++;else break;}
  return day;
}
function dayLabel(year,mi,day){if(!day)return"";const d=new Date(year,mi,day);return `${DOWS[d.getDay()]} ${MONTHS[mi].slice(0,3)} ${day}`;}

  const {data,error}=await db.from('mt_config').select('*');

  const out={tasks:[],team:[],cats:[],holidays:{}};
  (data||[]).forEach(r=>{

      if(r.key==='team')     out.team    =JSON.parse(r.value);
      if(r.key==='cats')     out.cats    =JSON.parse(r.value);
      if(r.key==='holidays') out.holidays=JSON.parse(r.value);
    }catch(e){}
  });
  return out;
}
async function sbSave(key,value){

async function sbLoadStatuses(year,mi){

  const out={};
  (data||[]).forEach(r=>{out[`${r.year}-${r.month}-${r.task_id}`]=r;});

}
async function sbLoadAllStatuses(year){
  const {data,error}=await db.from('mt_statuses').select('*').eq('year',year);
  if(error){console.error(error);return{};}
  const out={};
  (data||[]).forEach(r=>{out[`${r.year}-${r.month}-${r.task_id}`]=r;});
  return out;
}
async function sbPatchStatus(year,mi,taskId,patch){
  const {data:ex}=await db.from('mt_statuses').select('id').eq('year',year).eq('month',mi).eq('task_id',taskId).maybeSingle();
  const payload={year,month:mi,task_id:taskId,updated_at:new Date().toISOString(),...patch};
  if(ex){await db.from('mt_statuses').update(payload).eq('id',ex.id);}
  else  {await db.from('mt_statuses').insert(payload);}
}
