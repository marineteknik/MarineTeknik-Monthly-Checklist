                          {team.map(m=><option key={m.name} value={m.name}>{m.name.split(" ")[0]}</option>)}
                        </select>
                      </div>
                      <div style={{textAlign:"center"}}><input type="number" min="1" max="31" style={{width:52,padding:"3px 6px",borderRadius:5,border:"1px solid #e2e8f0",fontSize:12,textAlign:"center",background:"#f8fafc"}} value={task.startDay} onChange={e=>setTasks(tasks.map(x=>x.id===task.id?{...x,startDay:parseInt(e.target.value)||1}:x))}/></div>
                      <div style={{textAlign:"center"}}><input type="number" min="1" max="31" style={{width:52,padding:"3px 6px",borderRadius:5,border:"1px solid #e2e8f0",fontSize:12,textAlign:"center",background:"#f8fafc"}} value={task.deadlineDay} onChange={e=>setTasks(tasks.map(x=>x.id===task.id?{...x,deadlineDay:parseInt(e.target.value)||1}:x))}/></div>
                      <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                        <button style={{...S.smBtn,color:"#7c3aed",borderColor:"#ddd6fe",padding:"3px 8px",fontSize:12}} onClick={()=>setEditTask(task)}>✏</button>
                        <button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5",padding:"3px 8px",fontSize:12}} onClick={()=>deleteTask(task.id)}>✕</button>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
          </SCard>
        )}

        {tab==="categories"&&(
          <SCard title="🏷 Categories" sub="Saved to Supabase instantly.">
            {cats.map((cat,idx)=>{
              const tc=tasks.filter(t=>t.category===cat.name).length;
              const isEd=editCat?.idx===idx;
              return(
                <div key={idx} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#f8fafc",borderRadius:8,marginBottom:6,border:isEd?"2px solid #3b82f6":"2px solid transparent"}}>
                  <div style={{width:28,height:28,borderRadius:6,background:isEd?editCat.color:cat.color,flexShrink:0,border:"2px solid rgba(0,0,0,.1)",cursor:"pointer"}} onClick={()=>!isEd&&setEditCat({idx,name:cat.name,color:cat.color})}/>
                  {isEd?(
                    <div style={{flex:1,display:"flex",flexDirection:"column",gap:8}}>
                      <input style={{...S.inp,fontSize:14,padding:"6px 10px"}} value={editCat.name} onChange={e=>setEditCat(p=>({...p,name:e.target.value}))} autoFocus/>
                      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{palette.map(c=><div key={c} onClick={()=>setEditCat(p=>({...p,color:c}))} style={{width:22,height:22,borderRadius:4,background:c,cursor:"pointer",border:editCat.color===c?"3px solid #0f172a":"2px solid transparent",flexShrink:0}}/>)}</div>
                      <div style={{display:"flex",gap:8}}>
                        <button style={S.saveBtn} onClick={()=>{const old=cats[editCat.idx].name,nw=editCat.name.trim();const nc=cats.map((c,i)=>i===editCat.idx?{name:nw,color:editCat.color}:c);setCats(nc);if(old!==nw)setTasks(tasks.map(t=>t.category===old?{...t,category:nw}:t));setEditCat(null);}}>Save</button>
                        <button style={S.cancelBtn} onClick={()=>setEditCat(null)}>Cancel</button>
                      </div>
                    </div>
                  ):(
                    <>
                      <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{cat.name}</div><div style={{fontSize:12,color:"#64748b"}}>{tc} task{tc!==1?"s":""}</div></div>
                      <div style={{display:"flex",gap:4}}>
                        <button style={S.smBtn} onClick={()=>setEditCat({idx,name:cat.name,color:cat.color})}>Edit</button>
                        <button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5"}} onClick={()=>{if(tc>0){alert(`Can't delete — ${tc} tasks use this category.`);return;}if(window.confirm(`Delete "${cat.name}"?`))setCats(cats.filter((_,i)=>i!==idx));}}>Delete</button>
                      </div>
                    </>
                  )}
                </div>
              );
            })}
            <div style={{display:"flex",gap:8,marginTop:14,alignItems:"center",padding:"12px",background:"#f0f7ff",borderRadius:8,border:"1px dashed #93c5fd",flexWrap:"wrap"}}>
              <div style={{width:28,height:28,borderRadius:6,background:nCatC,flexShrink:0,border:"2px solid rgba(0,0,0,.1)"}}/>
              <input style={{...S.inp,flex:1,minWidth:120}} placeholder="New category name" value={nCatN} onChange={e=>setNCatN(e.target.value)}/>
              <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{palette.slice(0,10).map(c=><div key={c} onClick={()=>setNCatC(c)} style={{width:20,height:20,borderRadius:4,background:c,cursor:"pointer",border:nCatC===c?"3px solid #0f172a":"2px solid transparent"}}/>)}</div>
              <button style={S.addBtn} onClick={()=>{if(!nCatN.trim())return;setCats([...cats,{name:nCatN.trim(),color:nCatC}]);setNCatN("");}}>+ Add</button>
            </div>
          </SCard>
        )}

        {tab==="team"&&(
          <SCard title="👥 Team Members" sub="Saved to Supabase instantly.">
            {team.map((m,i)=>{
              const tc=tasks.filter(t=>t.owner===m.name).length;
              const isEd=editMem?.idx===i;
              return(
                <div key={i} style={{padding:"10px 12px",background:"#f8fafc",borderRadius:8,marginBottom:6,border:isEd?"2px solid #3b82f6":"2px solid transparent"}}>
                  {isEd?(
                    <div style={{display:"flex",flexDirection:"column",gap:10}}>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 100px",gap:10}}>
                        <FRow label="Full Name"><input style={S.inp} value={editMem.name} onChange={e=>setEditMem(p=>({...p,name:e.target.value}))} autoFocus/></FRow>
                        <FRow label="Initials"><input style={S.inp} value={editMem.initials} maxLength={3} onChange={e=>setEditMem(p=>({...p,initials:e.target.value.toUpperCase()}))}/></FRow>
                      </div>
                      <FRow label="Color"><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{tColors.map(c=><div key={c} onClick={()=>setEditMem(p=>({...p,color:c}))} style={{width:26,height:26,borderRadius:"50%",background:c,cursor:"pointer",border:editMem.color===c?"3px solid #0f172a":"2px solid transparent",flexShrink:0}}/>)}</div></FRow>
                      <div style={{display:"flex",gap:8}}>
                        <button style={S.saveBtn} onClick={()=>{setTeam(team.map((x,j)=>j===editMem.idx?{name:editMem.name.trim(),initials:editMem.initials.trim().slice(0,3),color:editMem.color}:x));setEditMem(null);}}>Save</button>
                        <button style={S.cancelBtn} onClick={()=>setEditMem(null)}>Cancel</button>
                      </div>
                    </div>
                  ):(
                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{width:38,height:38,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>{m.initials}</div>
                      <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{m.name}</div><div style={{fontSize:12,color:"#64748b"}}>{tc} task{tc!==1?"s":""} assigned</div></div>
                      <div style={{display:"flex",gap:6}}>
                        <button style={S.smBtn} onClick={()=>setEditMem({idx:i,...m})}>Edit</button>
                        <button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5"}} onClick={()=>{if(tc>0&&!window.confirm(`${m.name} owns ${tc} tasks. Remove anyway?`))return;setTeam(team.filter((_,j)=>j!==i));}}>Remove</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <input style={{...S.inp,flex:1}} placeholder="Full name of new team member" value={newMem} onChange={e=>setNewMem(e.target.value)} onKeyDown={e=>{if(e.key!=="Enter"||!newMem.trim())return;const i2=newMem.trim().split(" ").map(p=>p[0]).join("").toUpperCase().slice(0,3);setTeam([...team,{name:newMem.trim(),initials:i2,color:tColors[team.length%tColors.length]}]);setNewMem("");}}/>
              <button style={S.addBtn} onClick={()=>{if(!newMem.trim())return;const i2=newMem.trim().split(" ").map(p=>p[0]).join("").toUpperCase().slice(0,3);setTeam([...team,{name:newMem.trim(),initials:i2,color:tColors[team.length%tColors.length]}]);setNewMem("");}}>Add Member</button>
            </div>
          </SCard>
        )}

        {tab==="holidays"&&<HolidaysPanel year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} holidays={holidays} setHolidays={setHolidays}/>}
      </div>
    </div>
  );
}

// ── HOLIDAYS PANEL ────────────────────────────────────────────────────────────
function HolidaysPanel({year,mi,dlYear,dlMi,holidays,setHolidays}){
  const [editingMi,setEditingMi]=useState(null);
  const [nd,setNd]=useState("");const [nn,setNn]=useState("");
  const common={0:[{day:1,name:"New Year's Day"}],1:[{day:17,name:"Presidents Day"}],4:[{day:26,name:"Memorial Day"}],6:[{day:4,name:"Independence Day"}],8:[{day:1,name:"Labor Day"}],10:[{day:11,name:"Veterans Day"},{day:27,name:"Thanksgiving"}],11:[{day:25,name:"Christmas Day"}]};

  const addHol=(mIdx)=>{
    const d=parseInt(nd);if(!d||d<1||d>31||!nn.trim())return;
    const key=`${mIdx===dlMi&&dlYear!==year?dlYear:year}-${mIdx}`;
    const list=[...((holidays||{})[key]||[])];
    if(list.some(h=>h.day===d))return;
    setHolidays({...(holidays||{}),[key]:[...list,{day:d,name:nn.trim()}].sort((a,b)=>a.day-b.day)});
    setNd("");setNn("");
  };
  const removeHol=(mIdx,idx)=>{
    const key=`${mIdx===dlMi&&dlYear!==year?dlYear:year}-${mIdx}`;
    const list=[...((holidays||{})[key]||[])];list.splice(idx,1);
    setHolidays({...(holidays||{}),[key]:list});
  };

  return(
    <SCard title="🎌 Holidays" sub={`Holidays in the deadline month cause tasks to auto-skip forward. Currently showing: closing ${MONTHS[mi]} ${year}, deadlines in ${MONTHS[dlMi]} ${dlYear}.`}>
      <div style={{padding:"8px 12px",background:"#eff6ff",borderRadius:8,border:"1px solid #bfdbfe",fontSize:12,color:"#1e40af",marginBottom:14}}>
        💡 Since you are closing <strong>{MONTHS[mi]} {year}</strong>, deadlines fall in <strong>{MONTHS[dlMi]} {dlYear}</strong>. Add holidays for <strong>{MONTHS[dlMi]}</strong> below so deadlines skip those days.
      </div>
      {MONTHS.map((m,i)=>{
        const hYear=i===dlMi&&dlYear!==year?dlYear:year;
        const key=`${hYear}-${i}`;
        const hs=((holidays||{})[key])||[];
        const isOpen=editingMi===i;
        const isDlMonth=i===dlMi;
        const sugg=(common[i]||[]).filter(s=>!hs.some(h=>h.name===s.name));
        return(
          <div key={i} style={{borderRadius:8,marginBottom:6,border:isOpen?"2px solid #3b82f6":isDlMonth?"1px solid #bfdbfe":"1px solid #e2e8f0",overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",background:isOpen?"#eff6ff":isDlMonth?"#f8faff":"#f8fafc",cursor:"pointer"}} onClick={()=>setEditingMi(isOpen?null:i)}>
              <div style={{width:48,fontSize:13,fontWeight:700,color:isOpen?"#1d4ed8":isDlMonth?"#1e40af":"#374151"}}>{m.slice(0,3)}{isDlMonth&&<span style={{fontSize:10,marginLeft:4,color:"#3b82f6"}}>← deadlines</span>}</div>
              <div style={{flex:1,display:"flex",gap:6,flexWrap:"wrap"}}>
                {hs.length===0?<span style={{fontSize:12,color:"#cbd5e1"}}>No holidays</span>:hs.map((h,j)=>(
                  <span key={j} style={{padding:"2px 8px",borderRadius:4,background:"#fef9c3",color:"#92400e",fontSize:11,fontWeight:700,border:"1px solid #fde047",display:"flex",alignItems:"center",gap:4}}>
                    {ord(h.day)}: {h.name}
                    {isOpen&&<span style={{cursor:"pointer",color:"#dc2626",fontWeight:900,marginLeft:2}} onClick={e=>{e.stopPropagation();removeHol(i,j);}}>×</span>}
                  </span>
                ))}
              </div>
              <span style={{fontSize:12,color:"#94a3b8"}}>{isOpen?"▲":"▼"}</span>
            </div>
            {isOpen&&(
              <div style={{padding:"14px 16px",background:"#fff",borderTop:"1px solid #e2e8f0"}}>
                {sugg.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Quick Add</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {sugg.map((s,si)=>(
                        <button key={si} style={{padding:"4px 10px",borderRadius:6,border:"1px solid #e2e8f0",background:"#f8fafc",fontSize:12,cursor:"pointer",color:"#374151"}}
                          onClick={()=>{const key2=`${hYear}-${i}`;const list=[...((holidays||{})[key2]||[])];setHolidays({...(holidays||{}),[key2]:[...list,s].sort((a,b)=>a.day-b.day)});}}>
                          + {s.name} ({ord(s.day)})
                        </button>
                      ))}
                    </div>
                  </div>
                )}
                <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                  <div style={{display:"flex",flexDirection:"column",gap:4}}>
                    <label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px"}}>Day</label>
                    <input type="number" min="1" max="31" style={{width:64,padding:"7px 10px",borderRadius:6,border:"1px solid #e2e8f0",fontSize:13,textAlign:"center"}} placeholder="15" value={nd} onChange={e=>setNd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHol(i)}/>
                  </div>
                  <div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}>
                    <label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px"}}>Holiday Name</label>
                    <input style={{padding:"7px 12px",borderRadius:6,border:"1px solid #e2e8f0",fontSize:13,width:"100%"}} placeholder="e.g. Company Outing" value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addHol(i)}/>
                  </div>
                  <button style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#3b82f6",color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",height:36}} onClick={()=>addHol(i)}>+ Add</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </SCard>
  );
}

// ── HOLIDAY MODAL (top bar button) ────────────────────────────────────────────
function HolidayModal({year,mi,holidays,setHolidays,onClose,closingMonth}){
  const key=`${year}-${mi}`;
  const [list,setList]=useState([...((holidays||{})[key]||[])]);
  const [nd,setNd]=useState("");const [nn,setNn]=useState("");
  const add=()=>{const d=parseInt(nd);if(!d||d<1||d>31||!nn.trim()||list.some(h=>h.day===d))return;setList(p=>[...p,{day:d,name:nn.trim()}].sort((a,b)=>a.day-b.day));setNd("");setNn("");};
  const common={0:[{day:1,name:"New Year's Day"}],1:[{day:17,name:"Presidents Day"}],4:[{day:26,name:"Memorial Day"}],6:[{day:4,name:"Independence Day"}],8:[{day:1,name:"Labor Day"}],10:[{day:11,name:"Veterans Day"},{day:27,name:"Thanksgiving"}],11:[{day:25,name:"Christmas Day"}]};
  const sugg=(common[mi]||[]).filter(s=>!list.some(h=>h.name===s.name));
  return(
    <Overlay onClose={onClose}>
      <div style={{...S.modal,maxWidth:480}}>
        <div style={S.mHdr}>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>🎌 Holidays — {MONTHS[mi]} {year}</div>
            <div style={{fontSize:12,color:"#64748b",marginTop:3}}>Deadlines for the {closingMonth} close fall in this month. Holidays here are auto-skipped.</div>
          </div>
          <button style={S.xBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.mBody}>
          {list.length===0&&<div style={{color:"#94a3b8",fontSize:14,textAlign:"center",padding:"12px 0"}}>No holidays set.</div>}
          {list.map((h,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"#fffbeb",borderRadius:8,border:"1px solid #fde68a",marginBottom:6}}>
              <span style={{fontWeight:700,fontSize:14,color:"#92400e",minWidth:28}}>{ord(h.day)}</span>
              <span style={{flex:1,fontSize:14}}>{h.name}</span>
              <button style={{padding:"4px 8px",borderRadius:6,border:"1px solid #fca5a5",background:"#fff",fontSize:12,cursor:"pointer",color:"#dc2626",fontWeight:600}} onClick={()=>setList(p=>p.filter((_,j)=>j!==i))}>✕</button>
            </div>
          ))}
          {sugg.length>0&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:6}}>Quick Add</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{sugg.map((s,i)=><button key={i} style={S.cancelBtn} onClick={()=>setList(p=>[...p,s].sort((a,b)=>a.day-b.day))}>+ {s.name} ({ord(s.day)})</button>)}</div>
            </div>
          )}
          <div style={{display:"flex",gap:8,alignItems:"flex-end",marginTop:8}}>
            <FRow label="Day"><input type="number" min="1" max="31" style={{...S.inp,width:64}} placeholder="15" value={nd} onChange={e=>setNd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/></FRow>
            <div style={{flex:1}}><FRow label="Name"><input style={S.inp} placeholder="e.g. Company Outing" value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/></FRow></div>
            <button style={{...S.addBtn,height:38}} onClick={add}>+ Add</button>
          </div>
        </div>
        <div style={S.mFtr}>
          <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
          <button style={S.saveBtn} onClick={()=>{setHolidays({...(holidays||{}),[key]:list});onClose();}}>Save</button>
        </div>
      </div>
    </Overlay>
  );
}

// ── YEAR PICKER ───────────────────────────────────────────────────────────────
function YearPickModal({year,mi,onSelect,onClose}){
  const [sy,setSy]=useState(year);const [sm,setSm]=useState(mi);
  const ys=[];for(let y=2024;y<=2035;y++)ys.push(y);
  return(
    <Overlay onClose={onClose}>
      <div style={{...S.modal,maxWidth:380}}>
        <div style={S.mHdr}><div style={{fontSize:16,fontWeight:700}}>Jump to Closing Month</div><button style={S.xBtn} onClick={onClose}>✕</button></div>
        <div style={S.mBody}>
          <FRow label="Year"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{ys.map(y=><button key={y} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #e2e8f0",background:sy===y?"#3b82f6":"#f8fafc",color:sy===y?"#fff":"#374151",cursor:"pointer",fontWeight:sy===y?700:400}} onClick={()=>setSy(y)}>{y}</button>)}</div></FRow>
          <FRow label="Closing Month"><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>{MONTHS.map((m,i)=><button key={i} style={{padding:"6px 4px",borderRadius:6,border:"1px solid #e2e8f0",background:sm===i?"#3b82f6":"#f8fafc",color:sm===i?"#fff":"#374151",cursor:"pointer",fontSize:12,fontWeight:sm===i?700:400}} onClick={()=>setSm(i)}>{m.slice(0,3)}</button>)}</div></FRow>
        </div>
        <div style={S.mFtr}>
          <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
          <button style={S.saveBtn} onClick={()=>onSelect(sy,sm)}>Go to {MONTHS[sm].slice(0,3)} {sy}</button>
        </div>
      </div>
    </Overlay>
  );
}

// ── SHARED ────────────────────────────────────────────────────────────────────
function SCard({title,sub,children}){return(<div style={{background:"#fff",borderRadius:12,padding:"20px 22px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}><div style={{fontSize:15,fontWeight:700,marginBottom:sub?4:14}}>{title}</div>{sub&&<div style={{fontSize:13,color:"#64748b",marginBottom:14}}>{sub}</div>}{children}</div>);}
function FRow({label,children}){return(<div style={{display:"flex",flexDirection:"column",gap:6}}><label style={{fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:"0.5px"}}>{label}</label>{children}</div>);}
function StatusBtns({value,onChange}){const opts=[["DONE","✓ Done","#dcfce7","#166534"],["PENDING","⏳ Pending","#fef9c3","#854d0e"],["N/A","N/A","#f1f5f9","#64748b"],["","—","#f8fafc","#374151"]];return(<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{opts.map(([v,l,bg,col])=><button key={v} style={{padding:"6px 16px",borderRadius:6,border:`1px solid ${value===v?"#3b82f6":"#e2e8f0"}`,background:value===v?"#3b82f6":bg,color:value===v?"#fff":col,cursor:"pointer",fontSize:13,fontWeight:500}} onClick={()=>onChange(v)}>{l}</button>)}</div>);}
function Overlay({children,onClose}){return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16}} onClick={onClose}><div onClick={e=>e.stopPropagation()}>{children}</div></div>);}

const S={
  hdr:      {background:"#0f172a",color:"#f8fafc",display:"flex",alignItems:"center",padding:"0 20px",height:60,gap:16,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.3)",flexWrap:"wrap"},
  navBtn:   {padding:"5px 14px",borderRadius:6,border:"none",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:13,fontWeight:500},
  navOn:    {background:"#3b82f6",color:"#fff"},
