<script>
  // Check auth — session valid for 8 hours
  (function(){
    var auth=sessionStorage.getItem('mt_auth');
    var ts=parseInt(sessionStorage.getItem('mt_auth_ts')||'0');
    var EIGHT_HRS=8*60*60*1000;
    if(auth==='ok'&&(Date.now()-ts)<EIGHT_HRS){
      document.getElementById('login-screen').style.display='none';
      document.getElementById('root').style.display='block';
    } else {
      sessionStorage.removeItem('mt_auth');
      sessionStorage.removeItem('mt_auth_ts');
    }
  })();
  function checkPwd(){
    var val=document.getElementById('pwd-input').value;
    var btn=document.getElementById('sign-in-btn');
    if(val==='Marineteknik@2026'){
      sessionStorage.setItem('mt_auth','ok');
      sessionStorage.setItem('mt_auth_ts',Date.now().toString());
      btn.textContent='✓ Signed in…';
      btn.style.background='#10b981';
      setTimeout(function(){
        document.getElementById('login-screen').style.display='none';
        document.getElementById('root').style.display='block';
      },400);
    } else {
      document.getElementById('pwd-error').style.display='block';
      document.getElementById('pwd-input').value='';
      document.getElementById('pwd-input').focus();
      // Shake animation
      var input=document.getElementById('pwd-input');
      input.style.borderColor='#f87171';
      setTimeout(function(){input.style.borderColor='#334155';},1500);
    }
  }
</script>

const ord  = n => (!n&&n!==0)?"—":n+(n===1?"st":n===2?"nd":n===3?"rd":"th");

// Get today's date as YYYY-MM-DD in LOCAL timezone (not UTC)
function localDateStr(d){
  const dt=d||new Date();
  const y=dt.getFullYear();
  const m=String(dt.getMonth()+1).padStart(2,'0');
  const day=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// A task is "complete" if DONE or N/A (both owner AND reviewer)
const isComplete = st => (st.ownerStatus==="DONE"||st.ownerStatus==="N/A") && (st.reviewerStatus==="DONE"||st.reviewerStatus==="N/A"||!st.reviewerStatus);

// A task is "late" if it has a completion date that is after the effective deadline day
// OR if today is past the deadline and it is still not complete
function isLate(st, effDay, dlYear, dlMi){
  // Compare purely as integers: YYYYMMDD — no Date objects, no timezone issues
  if(!st.completionDate) return false;
  // completionDate is stored as 'YYYY-MM-DD'
  const parts = st.completionDate.split('-');
  if(parts.length !== 3) return false;
  const compVal = parseInt(parts[0])*10000 + parseInt(parts[1])*100 + parseInt(parts[2]);
  // deadline: dlYear, dlMi is 0-indexed so month+1 for numeric comparison
  const dlMiNum = dlMi + 1; // convert 0-indexed to 1-indexed
  const deadVal = dlYear*10000 + dlMiNum*100 + effDay;
  return compVal > deadVal;
}

function calcEffDay(baseDay,adjDay,year,mi,holidays){
  let day=adjDay!=null?adjDay:baseDay;
  const hols=((holidays||{})[`${year}-${mi}`]||[]).map(h=>h.day);
  let g=0;
  while(g++<20){const dow=new Date(year,mi,day).getDay();if(dow===0||dow===6||hols.includes(day))day++;else break;}
  return day;
}

async function sbLoad(){
  const {data,error}=await db.from('mt_config').select('*');
  if(error){console.error(error);return null;}
  const out={tasks:[],team:[],cats:[],holidays:{}};
  (data||[]).forEach(r=>{
    try{
      if(r.key==='tasks')    out.tasks   =JSON.parse(r.value);
      if(r.key==='team')     out.team    =JSON.parse(r.value);
      if(r.key==='cats')     out.cats    =JSON.parse(r.value);
      if(r.key==='holidays') out.holidays=JSON.parse(r.value);
    }catch(e){}
  });
  return out;
}
async function sbSave(key,value){
  await db.from('mt_config').upsert({key,value:JSON.stringify(value),updated_at:new Date().toISOString()},{onConflict:'key'});
}
async function sbLoadStatuses(year,mi){
  const {data,error}=await db.from('mt_statuses').select('*').eq('year',year).eq('month',mi);
  if(error){console.error(error);return{};}
  const out={};
  (data||[]).forEach(r=>{out[`${r.year}-${r.month}-${r.task_id}`]=r;});
  return out;
}
async function sbLoadAllStatuses(year){
  const {data,error}=await db.from('mt_statuses').select('*').eq('year',year);
  if(error){console.error(error);return{};}
  const out={};
  (data||[]).forEach(r=>{out[`${r.year}-${r.month}-${r.task_id}`]=r;});
  return out;
}
async function sbPatchStatus(year,mi,taskId,patch){
  const {data:ex}=await db.from('mt_statuses').select('id').eq('year',year).eq('month',mi).eq('task_id',taskId).maybeSingle();
  const payload={year,month:mi,task_id:taskId,updated_at:new Date().toISOString(),...patch};
  if(ex){await db.from('mt_statuses').update(payload).eq('id',ex.id);}
  else  {await db.from('mt_statuses').insert(payload);}
}

    if(!ready)return;
    (async()=>{
      setSyncing(true);setSyncLabel('Loading...');
      // Load full year so all 12 months show correct progress in dashboard
      const sts=await sbLoadAllStatuses(year);
      setStatuses(sts);
      setSyncing(false);setSyncLabel('Live');
    })();
  },[year,ready]);

  // ── Realtime subscriptions ──────────────────────────────────────────────────
  useEffect(()=>{
    if(!ready)return;
    const ch1=db.channel('st').on('postgres_changes',{event:'*',schema:'public',table:'mt_statuses'},(p)=>{
      const r=p.new||p.old;
      if(!r||r.year!==year)return;  // accept all months for this year
      const k=`${r.year}-${r.month}-${r.task_id}`;
      if(p.eventType==='DELETE') setStatuses(prev=>{const n={...prev};delete n[k];return n;});
      else setStatuses(prev=>({...prev,[k]:r}));
      setSyncLabel('Live ✓');
    }).subscribe();
    const ch2=db.channel('cfg').on('postgres_changes',{event:'*',schema:'public',table:'mt_config'},(p)=>{
      const r=p.new;if(!r)return;
      try{
        if(r.key==='tasks')    setTasksRaw(JSON.parse(r.value));
        if(r.key==='team')     setTeamRaw(JSON.parse(r.value));
        if(r.key==='cats')     setCatsRaw(JSON.parse(r.value));
        if(r.key==='holidays') setHolRaw(JSON.parse(r.value));
      }catch(e){}
      setSyncLabel('Live ✓');
    }).subscribe();
    return()=>{db.removeChannel(ch1);db.removeChannel(ch2);};
  },[year,mi,ready]);

  // ── Setters that also save to Supabase ──────────────────────────────────────
  const setTasks=useCallback(async(v)=>{const n=typeof v==='function'?v(tasks):v;setTasksRaw(n);await sbSave('tasks',n);},[tasks]);
  const setTeam =useCallback(async(v)=>{setTeamRaw(v);await sbSave('team',v);},[]);
  const setCats =useCallback(async(v)=>{setCatsRaw(v);await sbSave('cats',v);},[]);
  const setHolidays=useCallback(async(v)=>{setHolRaw(v);await sbSave('holidays',v);},[]);

  // ── Status helpers ───────────────────────────────────────────────────────────
  const sKey=(tid)=>`${year}-${mi}-${tid}`;
  const getSt=(tid)=>{
    const r=statuses[sKey(tid)]||{};
    return{ownerStatus:r.owner_status||'',reviewerStatus:r.reviewer_status||'',completionDate:r.completion_date||'',adjustedDeadline:r.adjusted_deadline??null,notes:r.notes||''};
  };
  const patch=useCallback(async(tid,p)=>{
    const k=sKey(tid);
    const ex=statuses[k]||{year,month:mi,task_id:tid};
    const merged={...ex};
    if('ownerStatus'     in p) merged.owner_status      =p.ownerStatus;
    if('reviewerStatus'  in p) merged.reviewer_status   =p.reviewerStatus;
    if('completionDate'  in p) merged.completion_date   =p.completionDate;
    if('adjustedDeadline'in p) merged.adjusted_deadline =p.adjustedDeadline;
    if('notes'           in p) merged.notes             =p.notes;
    setStatuses(prev=>({...prev,[k]:merged}));
    const dbP={};
    if('ownerStatus'     in p) dbP.owner_status      =p.ownerStatus;
    if('reviewerStatus'  in p) dbP.reviewer_status   =p.reviewerStatus;
    if('completionDate'  in p) dbP.completion_date   =p.completionDate;
    if('adjustedDeadline'in p) dbP.adjusted_deadline =p.adjustedDeadline;
    if('notes'           in p) dbP.notes             =p.notes;
    await sbPatchStatus(year,mi,tid,dbP);
  },[statuses,year,mi]);

  // ── Deadline month (deadlines fall in NEXT month after closing) ──────────────
  const dlMi   = mi===11 ? 0 : mi+1;
  const dlYear = mi===11 ? year+1 : year;
  const isCur  = today.getFullYear()===dlYear && today.getMonth()===dlMi;
  const effD   = task=>calcEffDay(task.deadlineDay,getSt(task.id).adjustedDeadline,dlYear,dlMi,holidays);

  // ── Month nav ────────────────────────────────────────────────────────────────
  const navMon=dir=>{
    if(dir===-1&&mi===0){setMi(11);setYear(y=>y-1);}
    else if(dir===1&&mi===11){setMi(0);setYear(y=>y+1);}
    else setMi(m=>m+dir);
  };

  // ── Task CRUD ─────────────────────────────────────────────────────────────────
  const saveTask=async t=>{
    const next=!t.id?[...tasks,{...t,id:Date.now()}]:tasks.map(x=>x.id===t.id?t:x);
    await setTasks(next);setEditTask(null);
    showToast(t.id?'Task updated ✓':'Task added ✓','success');
  };
  const deleteTask=async id=>{
    if(!window.confirm("Delete this task?"))return;
    await setTasks(tasks.filter(x=>x.id!==id));
    showToast('Task deleted');
  };

  // ── Excel export ─────────────────────────────────────────────────────────────
  const doExport=()=>{
    const wb=XLSX.utils.book_new();
    const mName=MONTHS[mi];
    const hdrs=["#","Task","Category","Owner","Reviewer","Base Deadline","Effective Deadline","Owner Status","Reviewer Status","Completion Date","Notes"];
    const rows=tasks.map((t,i)=>{
      const st=getSt(t.id);const eff=effD(t);
      return[i+1,t.name,t.category,t.owner,t.reviewer,ord(t.deadlineDay),`${DOWS[new Date(dlYear,dlMi,eff).getDay()]} ${ord(eff)} ${MONTHS[dlMi]}`,st.ownerStatus||'Not Started',st.reviewerStatus||'Not Started',st.completionDate||'',st.notes||''];
    });
    const ws=XLSX.utils.aoa_to_sheet([[`MarineTeknik Monthly Close — ${mName} ${year} (Deadlines in ${MONTHS[dlMi]} ${dlYear})`],[],[`Generated: ${new Date().toLocaleString()}`],[],hdrs,...rows]);
    ws['!cols']=[{wch:4},{wch:52},{wch:22},{wch:24},{wch:24},{wch:14},{wch:26},{wch:14},{wch:14},{wch:16},{wch:40}];
    XLSX.utils.book_append_sheet(wb,ws,`${mName} ${year}`);
    const yrHdrs=["Task","Category","Owner",...MONTHS.map(m=>m.slice(0,3))];
    const yrRows=tasks.map(t=>{const r=[t.name,t.category,t.owner];MONTHS.forEach((_,i2)=>{const s=statuses[`${year}-${i2}-${t.id}`];r.push(s?.owner_status||'');});return r;});
    const wsYr=XLSX.utils.aoa_to_sheet([[`FY${year} Summary`],[],yrHdrs,...yrRows]);
    wsYr['!cols']=[{wch:52},{wch:22},{wch:24},...MONTHS.map(()=>({wch:8}))];
    XLSX.utils.book_append_sheet(wb,wsYr,`FY${year} Summary`);
    XLSX.writeFile(wb,`MarineTeknik_Close_${mName}_${year}.xlsx`);
    showToast('Excel exported ✓','success');
  };

  // ── Derived ───────────────────────────────────────────────────────────────────
  const catNames=[...new Set([...cats.map(c=>c.name),...tasks.map(t=>t.category)])];
  const filtered=tasks.filter(t=>(fCat==="All"||t.category===fCat)&&(fOwner==="All"||t.owner===fOwner));
  const done   =filtered.filter(t=>{ const s=getSt(t.id); return isComplete(s); }).length;
  const lateCount=filtered.filter(t=>{ const s=getSt(t.id); const ef=effD(t); return isLate(s,ef,dlYear,dlMi); }).length;
  const pend   =filtered.filter(t=>getSt(t.id).ownerStatus==="PENDING").length;
  const notS   =filtered.filter(t=>!getSt(t.id).ownerStatus).length;
  const naC    =filtered.filter(t=>getSt(t.id).ownerStatus==="N/A").length;
  const pct    =filtered.length>0?Math.round(done/filtered.length*100):0;
  const overdue=isCur?tasks.filter(t=>{const s=getSt(t.id);const ef=effD(t);return !isComplete(s)&&today.getDate()>ef;}):[];
  const mHols=((holidays||{})[`${dlYear}-${dlMi}`])||[];

  if(!ready) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",gap:20,background:"#0f172a"}}>
      <span style={{fontSize:40}}>⚓</span>
      <div className="spinner"/>
      <div style={{color:"#94a3b8",fontSize:14}}>Connecting to Supabase…</div>
    </div>
  );

  return(
    <div style={{fontFamily:"'DM Sans','Segoe UI',sans-serif",background:"#f1f5f9",minHeight:"100vh"}}>

      {/* HEADER */}
      <div style={S.hdr}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <span style={{fontSize:24}}>⚓</span>
          <div>
            <div style={{fontWeight:800,fontSize:16,letterSpacing:"-0.5px"}}>MarineTeknik</div>
            <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px"}}>Monthly Close Tracker</div>
          </div>
        </div>
        <div style={{display:"flex",gap:3,background:"#1e293b",borderRadius:8,padding:3}}>
          {[["checklist","✓ Checklist"],["dashboard","📊 Dashboard"],["settings","⚙ Settings"]].map(([v,l])=>(
            <button key={v} style={{...S.navBtn,...(view===v?S.navOn:{})}} onClick={()=>setView(v)}>{l}</button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:20,background:"rgba(16,185,129,0.1)",border:"1px solid rgba(16,185,129,0.3)"}}>
          <div className="live-dot" style={{background:syncing?"#f59e0b":"#10b981"}}/>
          <span style={{fontSize:11,fontWeight:700,color:syncing?"#f59e0b":"#10b981"}}>{syncLabel}</span>
        </div>
        <button
          onClick={()=>{sessionStorage.removeItem('mt_auth');window.location.reload();}}
          style={{padding:"5px 14px",borderRadius:6,border:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"rgba(255,255,255,0.6)",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}
          title="Sign out">
          ⎋ Sign Out
        </button>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
          {mHols.length>0&&<button style={S.holPill} onClick={()=>setHolOpen(true)}>🎌 {mHols.length} holiday{mHols.length>1?"s":""}</button>}
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <button style={S.arrBtn} onClick={()=>navMon(-1)}>‹</button>
            <div style={{textAlign:"center",cursor:"pointer"}} onClick={()=>setYrOpen(true)}>
              <div style={{fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px"}}>Closing</div>
              <div style={S.monBtn}>{MONTHS[mi]} {year} ▾</div>
              <div style={{fontSize:9,color:"#94a3b8"}}>Due in {MONTHS[dlMi].slice(0,3)} {dlYear}</div>
            </div>
            <button style={S.arrBtn} onClick={()=>navMon(1)}>›</button>
          </div>
          <button style={S.expBtn} onClick={doExport}>↓ Export Excel</button>
        </div>
      </div>

      {/* STATS BAR */}
      <div style={S.statsBar}>
        {[{n:done,l:"Complete",c:"#10b981"},{n:lateCount,l:"Late",c:"#dc2626"},{n:pend,l:"Pending",c:"#f59e0b"},{n:notS,l:"Not Started",c:"#94a3b8"}].map(x=>(
          <div key={x.l} style={{textAlign:"center",minWidth:52}}>
            <div style={{fontSize:22,fontWeight:800,color:x.c,lineHeight:1.1}}>{x.n}</div>
            <div style={{fontSize:10,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px"}}>{x.l}</div>
          </div>
        ))}
        <div style={{display:"flex",flexDirection:"column",gap:3,minWidth:180}}>
          <div style={{fontSize:12,fontWeight:700,color:"#1e293b"}}>{pct}% complete</div>
          <div style={{height:8,background:"#e2e8f0",borderRadius:4,overflow:"hidden"}}>
            <div style={{height:"100%",borderRadius:4,width:`${pct}%`,background:pct===100?"#10b981":pct>60?"#3b82f6":"#f59e0b",transition:"width .4s"}}/>
          </div>
        </div>
        <div style={{padding:"4px 12px",borderRadius:6,background:"#eff6ff",border:"1px solid #bfdbfe",fontSize:12,color:"#1e40af",fontWeight:600,whiteSpace:"nowrap"}}>
          Closing <strong>{MONTHS[mi].slice(0,3)} {year}</strong> → Due <strong>{MONTHS[dlMi].slice(0,3)} {dlYear}</strong>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <select style={S.sel} value={fCat} onChange={e=>setFCat(e.target.value)}>
            <option value="All">All Categories</option>
            {catNames.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select style={S.sel} value={fOwner} onChange={e=>setFOwner(e.target.value)}>
            <option value="All">All Owners</option>
            {team.map(m=><option key={m.name} value={m.name}>{m.initials} – {m.name.split(" ")[0]}</option>)}
          </select>
          <button style={S.addBtn} onClick={()=>setEditTask(false)}>+ Add Task</button>
          <button style={S.holBtn} onClick={()=>setHolOpen(true)}>🎌 Holidays</button>
        </div>
      </div>

      {/* OVERDUE BANNER */}
      {overdue.length>0&&view==="checklist"&&(
        <div style={{background:"#fef2f2",borderBottom:"1px solid #fca5a5",padding:"8px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",fontSize:13,color:"#dc2626"}}>
          <span style={{fontWeight:700}}>⚠ {overdue.length} overdue:</span>
          {overdue.map(t=><span key={t.id} style={{background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:4,padding:"2px 8px",fontSize:12,whiteSpace:"nowrap"}}>{t.name.split("–")[0].trim()} (due {ord(effD(t))} {MONTHS[dlMi].slice(0,3)})</span>)}
        </div>
      )}

      {/* MAIN */}
      <div style={{padding:"20px",maxWidth:1300,margin:"0 auto"}}>
        {view==="checklist"&&(
          tasks.length===0
            ?<EmptyState onAdd={()=>setEditTask(false)} onSettings={()=>setView("settings")}/>
            :<ChecklistView tasks={filtered} getSt={getSt} patch={patch} effD={effD} team={team} cats={cats} dlYear={dlYear} dlMi={dlMi} isCur={isCur} todayD={today.getDate()} setStatusTask={setStatusTask} setEditTask={setEditTask} deleteTask={deleteTask}/>
        )}
        {view==="dashboard"&&<DashboardView tasks={tasks} statuses={statuses} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} getSt={getSt} effD={effD} team={team} cats={cats} holidays={holidays} patch={patch}/>}
        {view==="settings"&&<SettingsView team={team} setTeam={setTeam} tasks={tasks} setTasks={setTasks} cats={cats} setCats={setCats} holidays={holidays} setHolidays={setHolidays} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} setEditTask={setEditTask} deleteTask={deleteTask}/>}
      </div>

      {/* MODALS */}
      {statusTask&&<StatusModal task={statusTask} getSt={getSt} patch={patch} onClose={()=>setStatusTask(null)} cats={cats} dlYear={dlYear} dlMi={dlMi} holidays={holidays}/>}
      {editTask!==null&&<EditTaskModal task={editTask||null} onClose={()=>setEditTask(null)} onSave={saveTask} onDelete={editTask?()=>{deleteTask(editTask.id);setEditTask(null);}:null} team={team} cats={cats} setCats={setCats}/>}
      {holOpen&&<HolidayModal year={dlYear} mi={dlMi} holidays={holidays} setHolidays={setHolidays} onClose={()=>setHolOpen(false)} closingMonth={MONTHS[mi]}/>}
      {yrOpen&&<YearPickModal year={year} mi={mi} onSelect={(y,m)=>{setYear(y);setMi(m);setYrOpen(false);}} onClose={()=>setYrOpen(false)}/>}

      {/* TOAST */}
      {toast&&<div className="fade-in" style={{position:"fixed",bottom:20,right:20,zIndex:9999,padding:"12px 18px",borderRadius:10,background:toast.type==='error'?"#fef2f2":toast.type==='success'?"#f0fdf4":"#1e293b",color:toast.type==='error'?"#dc2626":toast.type==='success'?"#166534":"#f8fafc",fontSize:13,fontWeight:600,boxShadow:"0 8px 24px rgba(0,0,0,.18)",borderLeft:`4px solid ${toast.type==='error'?"#dc2626":toast.type==='success'?"#10b981":"#3b82f6"}`}}>{toast.msg}</div>}
    </div>
  );
}

// ── EMPTY STATE ───────────────────────────────────────────────────────────────
function EmptyState({onAdd,onSettings}){
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:360,gap:16,textAlign:"center"}}>
      <div style={{fontSize:56}}>📋</div>
      <div style={{fontSize:22,fontWeight:800,color:"#1e293b"}}>No tasks yet</div>
      <div style={{fontSize:15,color:"#64748b",maxWidth:400}}>Go to Settings and click "↺ Load Default Tasks" to load all 50 MarineTeknik tasks instantly.</div>
      <div style={{display:"flex",gap:12}}>
        <button style={{...S.addBtn,padding:"10px 22px",fontSize:15}} onClick={onAdd}>+ Add Task</button>
        <button style={{...S.cancelBtn,padding:"10px 22px",fontSize:15}} onClick={onSettings}>⚙ Settings</button>
      </div>
    </div>
  );
}

// ── CHECKLIST VIEW ────────────────────────────────────────────────────────────
function ChecklistView({tasks,getSt,patch,effD,team,cats,dlYear,dlMi,isCur,todayD,setStatusTask,setEditTask,deleteTask}){
  const orderedCats=[...cats.map(c=>c.name),...tasks.map(t=>t.category).filter(c=>!cats.find(x=>x.name===c))];
  const grouped={};
  tasks.forEach(t=>{if(!grouped[t.category])grouped[t.category]=[];grouped[t.category].push(t);});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {[...new Set(orderedCats)].filter(cat=>grouped[cat]?.length>0).map(cat=>{
        const ct=grouped[cat];
        const cdone=ct.filter(t=>isComplete(getSt(t.id))).length;
        const cna  =ct.filter(t=>getSt(t.id).ownerStatus==="N/A").length;
        const clate=ct.filter(t=>{ const s=getSt(t.id);const ef=effD(t);return isLate(s,ef,dlYear,dlMi); }).length;
        return(
          <div key={cat} style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 18px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              <span style={{width:10,height:10,borderRadius:"50%",background:cc(cat,cats),flexShrink:0,display:"inline-block"}}/>
              <span style={{fontWeight:700,fontSize:13,color:"#1e293b",flex:1}}>{cat}</span>
              <span style={{fontSize:12,color:"#64748b",fontWeight:600}}>{cdone}/{ct.length} complete</span>
              {clate>0&&<span style={{fontSize:11,fontWeight:700,color:"#ea580c",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:4,padding:"1px 6px",marginLeft:4}}>⚠ {clate} late</span>}
            </div>
            {ct.map(task=>{
              const st=getSt(task.id);
              const eff=effD(task);
              const isDone  =isComplete(st);
              const isNA    =st.ownerStatus==="N/A";
              const isPend  =st.ownerStatus==="PENDING";
              const isOver  =isCur&&!isDone&&todayD>eff;
              const wasLate =isLate(st,eff,dlYear,dlMi);
              const rowBg   =isDone&&wasLate?"#fff7ed":isDone?"#f0fdf4":isPend?"#fffbeb":isOver?"#fef2f2":"#fff";
              const effDate=new Date(dlYear,dlMi,eff);
              const dow=DOWS[effDate.getDay()];
              const moved=eff!==task.deadlineDay;
              const adj=st.adjustedDeadline!=null;
              return(
                <React.Fragment key={task.id}>
                <div className="trow" style={{display:"flex",alignItems:"center",padding:"10px 18px",borderBottom:"1px solid #f1f5f9",gap:12,background:rowBg}}>
                  <div style={{width:22,height:22,borderRadius:6,border:isDone?"none":"2px solid #cbd5e1",background:isDone?(wasLate?"#f97316":"#10b981"):"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}
                    onClick={()=>{if(isDone)patch(task.id,{ownerStatus:"",reviewerStatus:""});else patch(task.id,{ownerStatus:"DONE",reviewerStatus:"DONE",completionDate:localDateStr()});}}> 
                    {isDone&&(wasLate?"!":"✓")}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,color:isDone?(wasLate?"#c2410c":"#94a3b8"):"#1e293b",textDecoration:isDone?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                      {task.name}
                      {wasLate&&<span style={{marginLeft:8,fontSize:10,fontWeight:700,color:"#ea580c",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:4,padding:"1px 5px",textDecoration:"none",display:"inline-block"}}>LATE</span>}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3,flexWrap:"wrap"}}>
                      <span style={{padding:"2px 7px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:tcol(task.owner,team),flexShrink:0}}>{ini(task.owner,team)}</span>
                      {st.notes&&<span title={st.notes} style={{fontSize:11,cursor:"help"}}>📝</span>}
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0,minWidth:118,padding:"5px 10px",borderRadius:8,background:isOver?"#fef2f2":moved?"#f5f3ff":"#f8fafc",border:`1px solid ${isOver?"#fca5a5":moved?"#ddd6fe":"#e2e8f0"}`}}>
                    <div style={{fontSize:13,fontWeight:700,color:isOver?"#dc2626":moved?"#7c3aed":"#1e293b"}}>{isOver?"⚠ ":""}{dow} {ord(eff)}</div>
                    <div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>{MONTHS[dlMi].slice(0,3)} {dlYear}</div>
                    {moved&&<div style={{fontSize:10,color:adj?"#7c3aed":"#0891b2",fontWeight:600,marginTop:1}}>{adj?"adjusted":"skipped"} from {ord(task.deadlineDay)}</div>}
                  </div>
                  <div style={{display:"flex",gap:8,flexShrink:0}}>
                    <MiniDrop label="Owner"    value={st.ownerStatus}    onChange={v=>patch(task.id,{ownerStatus:v})}/>
                    <MiniDrop label="Reviewer" value={st.reviewerStatus} onChange={v=>patch(task.id,{reviewerStatus:v})}/>
                  </div>
                  <div style={{display:"flex",gap:5,flexShrink:0}}>
                    <button style={S.smBtn} onClick={()=>setStatusTask(task)}>Status</button>
                    <button style={{...S.smBtn,color:"#7c3aed",borderColor:"#ddd6fe"}} onClick={()=>setEditTask(task)}>✏ Edit</button>
                    <button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5"}} onClick={()=>deleteTask(task.id)}>✕</button>
                  </div>
                </div>
                {/* Inline comment row */}
                <CommentRow task={task} st={st} patch={patch}/>
                </React.Fragment>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// ── COMMENT ROW ───────────────────────────────────────────────────────────────
function CommentRow({task,st,patch}){
  const [open,setOpen]=useState(!!st.notes);
  const [val,setVal]=useState(st.notes||'');
  const [saving,setSaving]=useState(false);

  // Sync if notes change externally (realtime update from another user)
  useEffect(()=>{
    setVal(st.notes||'');
    if(st.notes) setOpen(true);
  },[st.notes]);

  const save=async()=>{
    setSaving(true);
    await patch(task.id,{notes:val.trim()});
    setSaving(false);
    if(!val.trim()) setOpen(false);
  };

  const hasNote=!!st.notes;

  return(
    <div style={{borderTop:open?"1px solid #f1f5f9":"none",background:open?"#fafafa":"transparent"}}>
      {!open&&(
        <div style={{padding:"0 18px 8px",display:"flex",alignItems:"center",gap:8}}>
          <button
            onClick={()=>setOpen(true)}
            style={{fontSize:11,color:"#94a3b8",background:"none",border:"1px dashed #e2e8f0",borderRadius:5,padding:"2px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
            💬 Add comment
          </button>
        </div>
      )}
      {open&&(
        <div style={{padding:"8px 18px 10px",display:"flex",gap:8,alignItems:"flex-start"}}>
          <div style={{fontSize:13,color:"#64748b",paddingTop:8,flexShrink:0}}>💬</div>
          <textarea
            value={val}
            onChange={e=>setVal(e.target.value)}
            onBlur={save}
            placeholder="Add a comment or explanation (e.g. delayed due to missing bank statement)…"
            style={{flex:1,padding:"7px 10px",borderRadius:6,border:"1px solid #e2e8f0",fontSize:12,color:"#374151",resize:"vertical",minHeight:36,maxHeight:120,fontFamily:"inherit",outline:"none",background:"#fff"}}
            onKeyDown={e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))save();}}
          />
          <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
            <button onClick={save} style={{padding:"5px 12px",borderRadius:6,border:"none",background:"#3b82f6",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>
              {saving?"…":"Save"}
            </button>
            <button onClick={()=>{if(!val.trim()){patch(task.id,{notes:''});setOpen(false);}else setOpen(false);}} style={{padding:"5px 12px",borderRadius:6,border:"1px solid #e2e8f0",background:"#fff",color:"#64748b",fontSize:12,cursor:"pointer"}}>
              Close
            </button>
          </div>
        </div>
      )}
      {!open&&hasNote&&(
        <div style={{padding:"0 18px 8px",display:"flex",alignItems:"flex-start",gap:6}} onClick={()=>setOpen(true)}>
          <span style={{fontSize:11}}>💬</span>
          <span style={{fontSize:12,color:"#374151",cursor:"pointer",flex:1,fontStyle:"italic"}}>"{st.notes}"</span>
          <button onClick={(e)=>{e.stopPropagation();patch(task.id,{notes:''});setVal('');}} style={{fontSize:10,color:"#dc2626",background:"none",border:"none",cursor:"pointer",padding:"0 4px",flexShrink:0}}>✕</button>
        </div>
      )}
    </div>
  );
}

function MiniDrop({label,value,onChange}){
  const cm={DONE:{background:"#dcfce7",color:"#166534",border:"1px solid #86efac"},PENDING:{background:"#fef9c3",color:"#854d0e",border:"1px solid #fde047"},"N/A":{background:"#e0f2fe",color:"#0369a1",border:"1px solid #7dd3fc"}};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:2}}>
      <span style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.5px"}}>{label}</span>
      <select style={{padding:"3px 7px",borderRadius:5,border:"1px solid #e2e8f0",fontSize:12,background:"#f8fafc",cursor:"pointer",...(cm[value]||{})}} value={value||""} onChange={e=>onChange(e.target.value)}>
        <option value="">—</option><option value="DONE">✓ Done</option><option value="PENDING">⏳ Pending</option><option value="N/A">N/A</option>
      </select>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function DashboardView({tasks,statuses,year,mi,dlYear,dlMi,getSt,effD,team,cats,holidays,patch}){
  const [tab,setTab]=useState("overview");
  const today=new Date();
  const isCur=today.getFullYear()===dlYear&&today.getMonth()===dlMi;
  const catNames=[...new Set(tasks.map(t=>t.category))];
  const mStats=MONTHS.map((m,i)=>{
    const tot=tasks.length;
    const dlMiI = i===11 ? 0 : i+1;
    const dlYrI = i===11 ? year+1 : year;
    const dn=tasks.filter(t=>{
      const s=statuses[`${year}-${i}-${t.id}`]||{};
      return s.owner_status==="DONE"||s.owner_status==="N/A";
    }).length;
    const late=tasks.filter(t=>{
      const s=statuses[`${year}-${i}-${t.id}`]||{};
      if(!s.completion_date) return false;
      const eff=calcEffDay(t.deadlineDay,s.adjusted_deadline??null,dlYrI,dlMiI,holidays);
      const st2={completionDate:s.completion_date};
      return isLate(st2,eff,dlYrI,dlMiI);
    }).length;
    return{month:m.slice(0,3),done:dn,total:tot,pct:tot>0?Math.round(dn/tot*100):0,late};
  });
  const cStats=catNames.map(cat=>{
    const ct=tasks.filter(t=>t.category===cat);
    const dn=ct.filter(t=>isComplete(getSt(t.id))).length;
    const tot=ct.length;
    return{cat,done:dn,total:tot,pct:tot>0?Math.round(dn/tot*100):0};
  });
  const oStats=team.map(m=>{
    const mt=tasks.filter(t=>t.owner===m.name);if(!mt.length)return null;
    const dn=mt.filter(t=>isComplete(getSt(t.id))).length;
    const ov=isCur?mt.filter(t=>{const s=getSt(t.id);return !isComplete(s)&&today.getDate()>effD(t);}).length:0;
    const lt=mt.filter(t=>{ const s=getSt(t.id);const ef=effD(t);return isLate(s,ef,dlYear,dlMi); }).length;
    return{...m,total:mt.length,done:dn,overdue:ov,late:lt,pct:Math.round(dn/mt.length*100)};
  }).filter(Boolean);
  if(!tasks.length) return <div style={{textAlign:"center",padding:"60px 20px",color:"#94a3b8",fontSize:15}}>No tasks yet.</div>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div style={{display:"flex",gap:4,background:"#e2e8f0",borderRadius:8,padding:3,width:"fit-content"}}>
        {[["overview","📊 Overview"],["manager","👔 Manager View"],["deadlines","📅 Deadline Manager"]].map(([v,l])=>(
          <button key={v} style={{padding:"7px 18px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:tab===v?"#fff":"transparent",color:tab===v?"#0f172a":"#64748b",boxShadow:tab===v?"0 1px 3px rgba(0,0,0,.1)":"none"}} onClick={()=>setTab(v)}>{l}</button>
        ))}
      </div>
      {tab==="overview"&&(
        <>
          <div style={{background:"#fff",borderRadius:12,padding:"20px 24px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={S.dTitle}>FY{year} — Monthly Progress (deadlines in following month)</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(12,1fr)",gap:8}}>
              {mStats.map((m,i)=>(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 4px",borderRadius:8,border:i===mi?"2px solid #3b82f6":"1px solid #f1f5f9",background:i===mi?"#eff6ff":"#fff"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase"}}>{m.month}</div>
                  <svg viewBox="0 0 36 36" style={{width:52,height:52}}>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke="#e2e8f0" strokeWidth="3.2"/>
                    <circle cx="18" cy="18" r="15.9" fill="none" stroke={m.pct===100?(m.late>0?"#f97316":"#10b981"):m.pct>0?"#3b82f6":"#e2e8f0"} strokeWidth="3.2" strokeDasharray={`${m.pct} ${100-m.pct}`} strokeDashoffset="25" transform="rotate(-90 18 18)"/>
                    <text x="18" y="20.5" textAnchor="middle" fontSize="7" fill={m.pct===100?(m.late>0?"#ea580c":"#10b981"):"#1e293b"} fontWeight="700">{m.pct}%</text>
                  </svg>
                  <div style={{fontSize:10,color:"#94a3b8"}}>{m.done}/{m.total}</div>
                  {m.late>0&&<div style={{fontSize:9,color:"#ea580c",fontWeight:700}}>⚠ {m.late} late</div>}
                </div>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:280,background:"#fff",borderRadius:12,padding:"20px 24px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={S.dTitle}>By Category — {MONTHS[mi].slice(0,3)} close</div>
              {cStats.map(c=>(
                <div key={c.cat} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:cc(c.cat,cats),flexShrink:0}}/>
                  <div style={{fontSize:12,color:"#374151",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.cat}</div>
                  <div style={{width:120,height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden",flexShrink:0}}>
                    <div style={{height:"100%",borderRadius:3,background:c.pct===100?"#10b981":cc(c.cat,cats),width:`${c.pct}%`}}/>
                  </div>
                  <div style={{fontSize:12,color:"#64748b",minWidth:36,textAlign:"right"}}>{c.done}/{c.total}</div>
                </div>
              ))}
            </div>
            <div style={{flex:1,minWidth:280,background:"#fff",borderRadius:12,padding:"20px 24px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
              <div style={S.dTitle}>By Team Member — {MONTHS[mi].slice(0,3)} close</div>
              {oStats.map(m=>(
                <div key={m.name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#1e293b",marginBottom:3}}>
                      {m.name.split(" ").slice(0,2).join(" ")}
                      {m.overdue>0&&<span style={{marginLeft:8,fontSize:11,color:"#dc2626",fontWeight:700}}>⚠ {m.overdue} overdue</span>}
                      {m.late>0&&<span style={{marginLeft:6,fontSize:11,color:"#ea580c",fontWeight:700}}>🕐 {m.late} late</span>}
                    </div>
                    <div style={{height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:3,background:m.pct===100?"#10b981":m.color,width:`${m.pct}%`}}/>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:"#64748b",minWidth:32,textAlign:"right"}}>{m.done}/{m.total}</div>
                </div>
              ))}
            </div>
          </div>
          {/* Late tasks this month */}
          <LateSummary tasks={tasks} statuses={statuses} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} holidays={holidays} team={team} cats={cats}/>
        </>
      )}
      {tab==="manager"&&<ManagerView tasks={tasks} statuses={statuses} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} getSt={getSt} effD={effD} team={team} cats={cats} isCur={isCur} today={today}/>}
      {tab==="deadlines"&&<DeadlineManager tasks={tasks} year={year} mi={mi} dlYear={dlYear} dlMi={dlMi} holidays={holidays} getSt={getSt} patch={patch} cats={cats} team={team}/>}
    </div>
  );
}

// ── MANAGER VIEW ──────────────────────────────────────────────────────────────
function ManagerView({tasks,statuses,year,mi,dlYear,dlMi,getSt,effD,team,cats,isCur,today}){
  const [sel,setSel]=useState("All");
  const memberData=team.map(m=>{
    const myTasks=tasks.filter(t=>t.owner===m.name);
    return{...m,tasks:myTasks.map(t=>{const st=getSt(t.id);const eff=effD(t);const isOver=isCur&&!isComplete(st)&&today.getDate()>eff;return{...t,st,eff,isOver};})};
  }).filter(m=>m.tasks.length>0);

  const yearRows=team.map(m=>{
    const mt=tasks.filter(t=>t.owner===m.name);if(!mt.length)return null;
    const months=MONTHS.map((_,i)=>{
      const tot=mt.length;
      const dn=mt.filter(t=>{const s=statuses[`${year}-${i}-${t.id}`]?.owner_status;return s==="DONE"||s==="N/A";}).length;
      return{done:dn,total:tot,pct:tot>0?Math.round(dn/tot*100):0};
    });
    return{...m,months};
  }).filter(Boolean);

  const filtered=sel==="All"?memberData:memberData.filter(m=>m.name===sel);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      {/* Summary cards */}
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        {memberData.map(m=>{
          const done=m.tasks.filter(t=>isComplete(t.st)).length;
          const overdue=m.tasks.filter(t=>t.isOver).length;
          const pend=m.tasks.filter(t=>t.st.ownerStatus==="PENDING").length;
          const pct=m.tasks.length>0?Math.round(done/m.tasks.length*100):0;
          return(
            <div key={m.name} onClick={()=>setSel(s=>s===m.name?"All":m.name)}
              style={{flex:"1 1 180px",background:"#fff",borderRadius:12,padding:16,boxShadow:"0 1px 4px rgba(0,0,0,.06)",cursor:"pointer",border:sel===m.name?"2px solid #3b82f6":"2px solid transparent"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                <div style={{width:36,height:36,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>{m.name.split(" ").slice(0,2).join(" ")}</div>
                  <div style={{fontSize:11,color:"#64748b"}}>{m.tasks.length} tasks</div>
                </div>
              </div>
              <div style={{height:6,background:"#e2e8f0",borderRadius:3,overflow:"hidden",marginBottom:6}}>
                <div style={{height:"100%",borderRadius:3,background:pct===100?"#10b981":m.color,width:`${pct}%`}}/>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11}}>
                <span style={{color:"#10b981",fontWeight:700}}>{done} done</span>
                {overdue>0&&<span style={{color:"#dc2626",fontWeight:700}}>⚠ {overdue}</span>}
                {pend>0&&<span style={{color:"#f59e0b",fontWeight:700}}>{pend} pending</span>}
                <span style={{color:"#64748b"}}>{pct}%</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* Task detail tables */}
      {filtered.map(m=>{
        const done=m.tasks.filter(t=>t.st.ownerStatus==="DONE").length;
        return(
          <div key={m.name} style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 20px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
              <div style={{fontWeight:700,fontSize:15,color:"#1e293b",flex:1}}>{m.name}</div>
              <div style={{fontSize:12,color:"#64748b",fontWeight:600}}>{done}/{m.tasks.length} complete — closing {MONTHS[mi].slice(0,3)} {year}, due {MONTHS[dlMi].slice(0,3)} {dlYear}</div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{background:"#f8fafc"}}>
                    {["Task","Category","Due Date","Owner Status","Reviewer Status","Completed","Notes"].map(h=>(
                      <th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {m.tasks.map(t=>{
                    const isDone  =isComplete(t.st);
                    const isNA    =t.st.ownerStatus==="N/A";
                    const wasLateM=isLate(t.st,t.eff,dlYear,dlMi);
                    const isPend  =t.st.ownerStatus==="PENDING";
                    const rowBg=isDone&&wasLateM?"#fff7ed":isDone?"#f0fdf4":t.isOver?"#fef2f2":isPend?"#fffbeb":"#fff";
                    const stColor=isDone&&wasLateM?"#ea580c":isDone&&isNA?"#0369a1":isDone?"#10b981":t.isOver?"#dc2626":isPend?"#f59e0b":"#cbd5e1";
                    const stLabel=isDone&&wasLateM?"🕐 Late":isDone&&isNA?"N/A ✓":isDone?"✓ Done":t.isOver?"⚠ Overdue":isPend?"⏳ Pending":isNA?"N/A":"—";
                    const effDate=new Date(dlYear,dlMi,t.eff);
                    return(
                      <tr key={t.id} style={{background:rowBg,borderBottom:"1px solid #f1f5f9"}}>
                        <td style={{padding:"10px 12px",fontSize:13,fontWeight:500,color:isDone?"#94a3b8":"#1e293b",textDecoration:isDone?"line-through":"none",maxWidth:280,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</td>
                        <td style={{padding:"10px 12px"}}><span style={{padding:"2px 7px",borderRadius:4,fontSize:10,fontWeight:700,color:"#fff",background:cc(t.category,cats),whiteSpace:"nowrap"}}>{t.category}</span></td>
                        <td style={{padding:"10px 12px",fontSize:12,fontWeight:600,color:t.isOver?"#dc2626":"#374151",whiteSpace:"nowrap"}}>{DOWS[effDate.getDay()]} {ord(t.eff)} {MONTHS[dlMi].slice(0,3)}</td>
                        <td style={{padding:"10px 12px"}}><span style={{padding:"3px 8px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:stColor,whiteSpace:"nowrap"}}>{stLabel}</span></td>
                        <td style={{padding:"10px 12px"}}>{t.st.reviewerStatus?<span style={{padding:"3px 8px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:t.st.reviewerStatus==="DONE"?"#10b981":t.st.reviewerStatus==="PENDING"?"#f59e0b":"#94a3b8",whiteSpace:"nowrap"}}>{t.st.reviewerStatus==="DONE"?"✓ Done":t.st.reviewerStatus==="PENDING"?"⏳ Pending":"N/A"}</span>:<span style={{color:"#cbd5e1",fontSize:11}}>—</span>}</td>
                        <td style={{padding:"10px 12px",fontSize:11,color:"#64748b",whiteSpace:"nowrap"}}>{t.st.completionDate||"—"}</td>
                        <td style={{padding:"10px 12px",fontSize:11,color:t.st.notes?"#374151":"#cbd5e1",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontStyle:t.st.notes?"italic":"normal"}}>
                          {t.st.notes?<span title={t.st.notes}>💬 {t.st.notes}</span>:"—"}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      {/* Year history table */}
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{padding:"14px 20px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:14,color:"#1e293b"}}>📅 FY{year} — Month-by-Month Completion per Employee</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead>
              <tr style={{background:"#0f172a"}}>
                <th style={{padding:"10px 16px",textAlign:"left",color:"rgba(255,255,255,0.7)",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",minWidth:160}}>Employee</th>
                {MONTHS.map((m,i)=>(<th key={i} style={{padding:"10px 8px",textAlign:"center",color:i===mi?"#fbbf24":"rgba(255,255,255,0.7)",fontSize:11,fontWeight:i===mi?700:600,textTransform:"uppercase",letterSpacing:"0.5px",minWidth:52,background:i===mi?"rgba(255,255,255,0.08)":"transparent"}}>{m.slice(0,3)}</th>))}
              </tr>
            </thead>
            <tbody>
              {yearRows.map((m,ri)=>(
                <tr key={m.name} style={{borderBottom:"1px solid #f1f5f9",background:ri%2===0?"#fff":"#f8fafc"}}>
                  <td style={{padding:"10px 16px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:28,height:28,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff",flexShrink:0}}>{m.initials}</div>
                      <span style={{fontSize:13,fontWeight:600,color:"#1e293b"}}>{m.name.split(" ").slice(0,2).join(" ")}</span>
                    </div>
                  </td>
                  {m.months.map((mo,i)=>(
                    <td key={i} style={{padding:"10px 8px",textAlign:"center",background:i===mi?"rgba(59,130,246,0.04)":"transparent"}}>
                      {mo.total===0?<span style={{color:"#cbd5e1",fontSize:11}}>—</span>:
                        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                          <span style={{fontSize:12,fontWeight:700,color:mo.pct===100?"#10b981":mo.pct>0?"#3b82f6":"#94a3b8"}}>{mo.pct}%</span>
                          <span style={{fontSize:10,color:"#94a3b8"}}>{mo.done}/{mo.total}</span>
                        </div>
                      }
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── LATE SUMMARY ─────────────────────────────────────────────────────────────
function LateSummary({tasks,statuses,year,mi,dlYear,dlMi,holidays,team,cats}){
  const lateTasks=tasks.map(t=>{
    const s=statuses[`${year}-${mi}-${t.id}`]||{};
    if(!s.completion_date) return null;
    const eff=calcEffDay(t.deadlineDay,s.adjusted_deadline??null,dlYear,dlMi,holidays);
    const st2={completionDate:s.completion_date};
    if(!isLate(st2,eff,dlYear,dlMi)) return null;
    // Calculate days late using pure numeric comparison
    const parts=s.completion_date.split('-');
    const completed=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
    const deadline=new Date(dlYear,dlMi,eff);
    const daysLate=Math.ceil((completed-deadline)/(1000*60*60*24));
    return{...t,s,eff,daysLate,completedDate:s.completion_date};
  }).filter(Boolean);

  if(!lateTasks.length) return(
    <div style={{background:"#f0fdf4",borderRadius:12,padding:"16px 20px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",display:"flex",alignItems:"center",gap:10}}>

      </div>
    </div>
  );

  return(
    <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
      <div style={{padding:"14px 20px",background:"#fff7ed",borderBottom:"1px solid #fed7aa",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:18}}>🕐</span>
        <div style={{fontWeight:700,fontSize:14,color:"#c2410c",flex:1}}>Late Tasks — {MONTHS[mi]} {year} Close</div>
        <div style={{fontSize:12,color:"#ea580c",fontWeight:600}}>{lateTasks.length} task{lateTasks.length!==1?"s":""} completed after deadline</div>
      </div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead>
          <tr style={{background:"#f8fafc"}}>
            {["Task","Category","Owner","Deadline","Completed","Days Late","Notes"].map(h=>(
              <th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:10,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",borderBottom:"1px solid #e2e8f0",whiteSpace:"nowrap"}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {lateTasks.map(t=>(
            <tr key={t.id} style={{borderBottom:"1px solid #f1f5f9",background:"#fffbf5"}}>
              <td style={{padding:"10px 12px",fontSize:13,fontWeight:600,color:"#1e293b",maxWidth:260,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</td>
              <td style={{padding:"10px 12px"}}><span style={{padding:"2px 7px",borderRadius:4,fontSize:10,fontWeight:700,color:"#fff",background:cc(t.category,cats),whiteSpace:"nowrap"}}>{t.category}</span></td>
              <td style={{padding:"10px 12px"}}>
                <span style={{padding:"2px 7px",borderRadius:4,fontSize:11,fontWeight:700,color:"#fff",background:tcol(t.owner,team),whiteSpace:"nowrap"}}>{ini(t.owner,team)}</span>
              </td>
              <td style={{padding:"10px 12px",fontSize:12,color:"#374151",whiteSpace:"nowrap"}}>{ord(t.eff)} {MONTHS[dlMi].slice(0,3)}</td>
              <td style={{padding:"10px 12px",fontSize:12,color:"#374151",whiteSpace:"nowrap"}}>{t.completedDate}</td>
              <td style={{padding:"10px 12px"}}>
                <span style={{padding:"3px 8px",borderRadius:20,fontSize:11,fontWeight:700,color:"#fff",background:t.daysLate>7?"#dc2626":t.daysLate>3?"#ea580c":"#f97316",whiteSpace:"nowrap"}}>+{t.daysLate} day{t.daysLate!==1?"s":""}</span>
              </td>
              <td style={{padding:"10px 12px",fontSize:11,color:"#64748b",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontStyle:t.s.notes?"italic":"normal"}}>{t.s.notes||"—"}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ── DEADLINE MANAGER ──────────────────────────────────────────────────────────
function DeadlineManager({tasks,year,mi,dlYear,dlMi,holidays,getSt,patch,cats,team}){
  const mHols=((holidays||{})[`${dlYear}-${dlMi}`])||[];
  const dim=new Date(dlYear,dlMi+1,0).getDate();
  const [local,setLocal]=useState({});
  const [saved,setSaved]=useState(false);
  const getVal=tid=>{if(local[tid]!==undefined)return local[tid];const a=getSt(tid).adjustedDeadline;return a!=null?String(a):"";};
  const getEff=(task,val)=>calcEffDay(task.deadlineDay,val!==""&&val!=null?parseInt(val):null,dlYear,dlMi,holidays);
  const hasChanges=Object.keys(local).length>0;
  const saveAll=()=>{Object.entries(local).forEach(([tid,val])=>patch(parseInt(tid),{adjustedDeadline:val!==""?parseInt(val):null}));setLocal({});setSaved(true);setTimeout(()=>setSaved(false),2500);};
  const resetTask=tid=>{setLocal(p=>{const n={...p};delete n[tid];return n;});patch(tid,{adjustedDeadline:null});};
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{background:"#fff",borderRadius:12,padding:"18px 22px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12,marginBottom:mHols.length?14:0}}>
          <div>
            <div style={{fontWeight:700,fontSize:16}}>📅 Deadline Manager — Closing {MONTHS[mi]} {year} · Due in {MONTHS[dlMi]} {dlYear}</div>
            <div style={{fontSize:13,color:"#64748b",marginTop:4}}>Override base deadlines for this month. Weekends and holidays are always skipped forward automatically.</div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {saved&&<span style={{fontSize:13,color:"#10b981",fontWeight:600}}>✓ Saved!</span>}
            {hasChanges&&!saved&&<span style={{fontSize:12,color:"#f59e0b",fontWeight:600}}>● Unsaved changes</span>}
            <button style={{...S.addBtn,...(!hasChanges?{opacity:.45,cursor:"not-allowed"}:{})}} disabled={!hasChanges} onClick={saveAll}>Save Deadlines</button>
          </div>
        </div>
        {mHols.length>0&&(
          <div style={{padding:"10px 14px",background:"#fefce8",borderRadius:8,border:"1px solid #fde68a",fontSize:13,color:"#92400e"}}>
            <strong>🎌 Holidays in {MONTHS[dlMi]}:</strong>{" "}{mHols.map((h,i)=><span key={i}>{ord(h.day)} {h.name}{i<mHols.length-1?", ":""}</span>)}
            <span style={{color:"#b45309",marginLeft:8}}>(deadlines auto-skip these)</span>
          </div>
        )}
      </div>
      <div style={{background:"#fff",borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <div style={{display:"grid",gridTemplateColumns:"minmax(200px,1fr) 80px 120px 150px 130px 80px",padding:"10px 18px",background:"#f8fafc",borderBottom:"2px solid #e2e8f0",fontSize:11,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px"}}>
          <div>Task</div><div style={{textAlign:"center"}}>Base Due</div><div style={{textAlign:"center"}}>Adjusted</div><div style={{textAlign:"center"}}>Effective Date</div><div style={{textAlign:"center"}}>Day of Week</div><div style={{textAlign:"center"}}>Reset</div>
        </div>
        {tasks.map(task=>{
          const val=getVal(task.id);const eff=getEff(task,val);const base=task.deadlineDay;
          const effDate=new Date(dlYear,dlMi,eff);const dow=DOWS[effDate.getDay()];
          const wknd=effDate.getDay()===0||effDate.getDay()===6;const isHol=mHols.some(h=>h.day===eff);
          const moved=eff!==(val!==""&&val!=null?parseInt(val):base);const hasAdj=val!=="";
          const isDirty=local[task.id]!==undefined;const isDone=getSt(task.id).ownerStatus==="DONE";
          return(
            <div key={task.id} style={{display:"grid",gridTemplateColumns:"minmax(200px,1fr) 80px 120px 150px 130px 80px",padding:"10px 18px",borderBottom:"1px solid #f1f5f9",alignItems:"center",background:isDirty?"#fefce8":isDone?"#f0fdf4":"#fff"}}>
              <div style={{paddingRight:12}}>
                <div style={{fontSize:13,fontWeight:600,color:isDone?"#94a3b8":"#1e293b",textDecoration:isDone?"line-through":"none"}}>{task.name}</div>
                <div style={{display:"flex",gap:6,marginTop:3,alignItems:"center"}}>
                  <span style={{padding:"1px 6px",borderRadius:4,fontSize:10,fontWeight:700,color:"#fff",background:cc(task.category,cats)}}>{task.category}</span>
                </div>
              </div>
              <div style={{textAlign:"center",fontSize:14,fontWeight:700,color:"#64748b"}}>{ord(base)}</div>
              <div style={{textAlign:"center"}}>
                <input type="number" min="1" max={dim} style={{width:70,padding:"5px 8px",borderRadius:6,border:`2px solid ${isDirty?"#f59e0b":"#e2e8f0"}`,fontSize:13,textAlign:"center",background:isDirty?"#fffbeb":"#f8fafc",fontWeight:600}} placeholder={String(base)} value={val} onChange={e=>setLocal(p=>({...p,[task.id]:e.target.value}))}/>
                {isDirty&&<div style={{fontSize:10,color:"#f59e0b",marginTop:2}}>unsaved</div>}
              </div>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:14,fontWeight:700,color:moved?"#7c3aed":hasAdj?"#0891b2":"#1e293b"}}>{ord(eff)}</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>{MONTHS[dlMi].slice(0,3)} {dlYear}</div>
                {moved&&<div style={{fontSize:10,color:"#7c3aed",fontWeight:600,marginTop:1}}>↑ auto-skipped</div>}
              </div>
              <div style={{textAlign:"center"}}>
                <span style={{display:"inline-block",padding:"4px 10px",borderRadius:20,fontSize:12,fontWeight:700,background:wknd||isHol?"#fee2e2":"#dcfce7",color:wknd||isHol?"#dc2626":"#166534"}}>{dow} {isHol?"🎌":wknd?"⛔":"✓"}</span>
                {(wknd||isHol)&&<div style={{fontSize:10,color:"#dc2626",marginTop:2}}>→ moved to {ord(eff)}</div>}
              </div>
              <div style={{textAlign:"center"}}>
                {hasAdj?<button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5",fontSize:11}} onClick={()=>resetTask(task.id)}>Reset</button>:<span style={{fontSize:11,color:"#cbd5e1"}}>—</span>}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{fontSize:12,color:"#94a3b8",textAlign:"right"}}>💡 Deadlines fall in {MONTHS[dlMi]} {dlYear}. Leave "Adjusted" blank to use the base deadline.</div>
    </div>
  );
}

          <FRow label="Reviewer Status"><StatusBtns value={local.reviewerStatus||""} onChange={v=>setLocal(p=>({...p,reviewerStatus:v}))}/></FRow>
          <FRow label="Completion Date"><input type="date" style={S.inp} value={local.completionDate||""} onChange={e=>setLocal(p=>({...p,completionDate:e.target.value}))}/></FRow>
          <FRow label={<>Adjusted Deadline <span style={{color:"#7c3aed",fontWeight:400,textTransform:"none",fontSize:11}}>(this month only)</span></>}>

              <input type="number" min="1" max="31" style={{...S.inp,width:80}} placeholder={task.deadlineDay} value={local.adjustedDeadline??""} onChange={e=>setLocal(p=>({...p,adjustedDeadline:e.target.value?parseInt(e.target.value):null}))}/>
              <span style={{fontSize:12,color:"#64748b"}}>weekends & holidays auto-skipped</span>
              {local.adjustedDeadline!=null&&<button style={S.cancelBtn} onClick={()=>setLocal(p=>({...p,adjustedDeadline:null}))}>Clear</button>}
            </div>
          </FRow>
          <FRow label="Notes"><textarea style={{...S.inp,minHeight:72,resize:"vertical"}} value={local.notes||""} onChange={e=>setLocal(p=>({...p,notes:e.target.value}))} placeholder="Notes, blockers, reason for delay..."/></FRow>
        </div>
        <div style={S.mFtr}>
          <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
          <button style={S.saveBtn} onClick={save}>Save</button>
        </div>
      </div>
    </Overlay>
  );
}

// ── EDIT TASK MODAL ───────────────────────────────────────────────────────────
function EditTaskModal({task,onClose,onSave,onDelete,team,cats,setCats}){
  const isNew=!task;
  const catNames=cats.map(c=>c.name);
  const [form,setForm]=useState(task?{...task}:{name:"",owner:team[0]?.name||"",reviewer:team[0]?.name||"",startDay:1,deadlineDay:15,category:catNames[0]||""});
  const [newCatMode,setNewCatMode]=useState(false);
  const [newCatName,setNewCatName]=useState("");
  const valid=form.name.trim()&&form.owner&&form.deadlineDay>=1&&form.deadlineDay<=31;
  const handleSave=async()=>{
    let cat=form.category;
    if(newCatMode&&newCatName.trim()){cat=newCatName.trim();if(!cats.find(c=>c.name===cat))await setCats([...cats,{name:cat,color:"#374151"}]);}
    onSave({...form,category:cat,name:form.name.trim()});
  };
  return(
    <Overlay onClose={onClose}>
      <div style={S.modal}>
        <div style={S.mHdr}>
          <div>
            <div style={{fontSize:16,fontWeight:700}}>{isNew?"➕ Add New Task":"✏ Edit Task"}</div>
            <div style={{fontSize:12,color:"#64748b",marginTop:3}}>Deadline day = day in the following month (e.g. 5 = 5th of next month)</div>
          </div>
          <button style={S.xBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.mBody}>
          <FRow label="Task Name *"><input style={S.inp} value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="e.g. Bank Reconciliation" autoFocus={isNew}/></FRow>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <FRow label="Owner *">
              <select style={S.inp} value={form.owner} onChange={e=>setForm(p=>({...p,owner:e.target.value}))}>
                {team.map(m=><option key={m.name} value={m.name}>{m.name}</option>)}
              </select>
            </FRow>
            <FRow label="Reviewer">
              <select style={S.inp} value={form.reviewer} onChange={e=>setForm(p=>({...p,reviewer:e.target.value}))}>
                {team.map(m=><option key={m.name} value={m.name}>{m.name}</option>)}
              </select>
            </FRow>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <FRow label="Start Day"><input type="number" min="1" max="31" style={S.inp} value={form.startDay} onChange={e=>setForm(p=>({...p,startDay:parseInt(e.target.value)||1}))}/></FRow>
            <FRow label="Deadline Day (of following month) *"><input type="number" min="1" max="31" style={S.inp} value={form.deadlineDay} onChange={e=>setForm(p=>({...p,deadlineDay:parseInt(e.target.value)||15}))}/></FRow>
          </div>
          <FRow label="Category">
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              {!newCatMode?<select style={{...S.inp,flex:1}} value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))}>{catNames.map(c=><option key={c} value={c}>{c}</option>)}</select>:<input style={{...S.inp,flex:1}} placeholder="New category name" value={newCatName} onChange={e=>setNewCatName(e.target.value)}/>}
              <button style={S.cancelBtn} onClick={()=>{setNewCatMode(v=>!v);setNewCatName("");}}>{newCatMode?"Use existing":"+ New cat"}</button>
            </div>
          </FRow>
        </div>
        <div style={{...S.mFtr,justifyContent:"space-between"}}>
          <div>{onDelete&&<button style={{...S.smBtn,color:"#dc2626",borderColor:"#fca5a5"}} onClick={onDelete}>🗑 Delete</button>}</div>
          <div style={{display:"flex",gap:10}}>
            <button style={S.cancelBtn} onClick={onClose}>Cancel</button>
            <button style={{...S.saveBtn,...(!valid?{opacity:.5,cursor:"not-allowed"}:{})}} disabled={!valid} onClick={handleSave}>{isNew?"Add Task":"Save Changes"}</button>
          </div>
        </div>
      </div>
    </Overlay>
  );
}
